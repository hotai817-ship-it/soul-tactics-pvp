<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《英魂決》房間式即時對戰空間</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --gold: #D4AF37; --bg: #0f172a; --panel: rgba(26, 43, 76, 0.95); }
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; background: var(--bg); color: #f8fafc; margin: 0; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
        }
        .container { width: 100%; max-width: 1200px; height: 100vh; max-height: 950px; display: flex; flex-direction: column; padding: 10px; }
        h1 { color: var(--gold); font-size: clamp(1.4rem, 2.5vw, 2rem); margin: 5px 0; text-align: center; }
        .btn { background: linear-gradient(#d4af37, #aa771c); color: #111; border: 2px solid #ffe066; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: clamp(0.9rem, 1.5vw, 1.1rem); margin: 5px; }
        .input-box { background: #1e293b; border: 1px solid var(--gold); color: white; padding: 10px; border-radius: 6px; font-size: 1rem; width: 180px; text-align: center; margin: 5px; }
        .hud { background: var(--panel); border: 1px solid var(--gold); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(0.9rem, 1.5vw, 1.1rem); font-weight: bold; }
        .arena { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; flex-grow: 1; overflow: hidden; }
        .zone { display: flex; gap: 10px; justify-content: center; align-items: center; width: 100%; overflow-x: auto; padding: 5px; }
        .card { 
            background: #FFFDF0; color: #1e293b; border: 2px solid var(--gold); border-radius: 8px; 
            width: clamp(100px, 15vw, 130px); height: clamp(140px, 22vw, 180px); padding: 6px; 
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .log { background: #000; color: #38bdf8; font-family: monospace; padding: 8px; height: 70px; overflow-y: auto; text-align: left; border-radius: 6px; font-size: clamp(0.8rem, 1.2vw, 0.95rem); }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .modal-content { background: #1e293b; border: 3px solid var(--gold); padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; text-align: center; }
        .modal-btn { background: #3b82f6; color: white; border: none; padding: 10px; margin: 6px 0; border-radius: 6px; width: 100%; cursor: pointer; text-align: left; font-weight: bold; font-size: clamp(0.9rem, 1.5vw, 1rem); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <h1>《英魂決》房間式即時對戰空間</h1>
    
    <div id="lobby" style="margin: auto; text-align: center; background: var(--panel); padding: 30px; border: 2px solid var(--gold); border-radius: 15px;">
        <h3 style="color: var(--gold); margin-top:0;">選擇對戰模式</h3>
        <button class="btn" onclick="findGame()">🚀 快速隨機配對</button><br><br>
        <hr style="border-color: #334155; margin: 15px 0;">
        <button class="btn" onclick="createRoom()">🏠 建立私人房間</button><br>
        <input type="text" id="roomInput" class="input-box" placeholder="輸入 4 位房號">
        <button class="btn" onclick="joinRoom()">🔑 加入房間</button>
    </div>

    <div id="gameArea" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1; gap: 8px; overflow: hidden;">
        <div class="hud">
            <div>對手 HP: <span id="opHp" style="color:#ef4444;">300</span></div>
            <div id="turnIndicator">回合狀態</div>
            <div>我的 HP: <span id="myHp" style="color:#22c55e;">300</span></div>
        </div>

        <div class="arena">
            <div>
                <div style="color:var(--gold); font-size:0.85em; text-align:left;">對手主戰英雄</div>
                <div class="zone" id="opActive"></div>
            </div>
            <div>
                <div style="color:var(--gold); font-size:0.85em; text-align:left;">我方主戰英雄 (點擊發動攻擊)</div>
                <div class="zone" id="myActive"></div>
            </div>
        </div>

        <div>
            <div style="color:var(--gold); font-size:0.85em; text-align:left; margin-bottom:3px;">手牌區 (點擊卡牌部署)</div>
            <div class="zone" id="myHand" style="min-height: 150px; background: rgba(0,0,0,0.3); border-radius: 8px;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <button class="btn" onclick="endTurn()" style="padding: 10px 16px;">結束回合</button>
            <div class="log" id="logBox" style="flex-grow: 1;">[系統] 準備就緒。</div>
        </div>
    </div>
</div>

<div id="questionModal" class="modal hidden">
    <div class="modal-content">
        <h3 style="color:var(--gold); margin-top:0;">📜 歷史考驗與戰技激發</h3>
        <p id="qText" style="font-size: clamp(0.95rem, 1.5vw, 1.1rem); margin: 15px 0;"></p>
        <div id="qOptions"></div>
    </div>
</div>

<script>
    const socket = io();
    let currentRoomId = null;

    function findGame() {
        document.getElementById('lobby').innerHTML = "<h3 style='color:var(--gold);'>⏳ 正在隨機配對對手...</h3>";
        socket.emit('find_game');
    }

    function createRoom() { socket.emit('create_room'); }
    function joinRoom() {
        const roomId = document.getElementById('roomInput').value.trim();
        if (!roomId) { alert("請輸入房號！"); return; }
        socket.emit('join_room', roomId);
    }

    socket.on('room_created', (roomId) => {
        document.getElementById('lobby').innerHTML = `<h3 style='color:var(--gold);'>🏠 房間建立成功！</h3><p>您的專屬房號是：<b style="font-size:1.5em; color:#38bdf8;">${roomId}</b></p><p>等待對手加入...</p>`;
    });

    socket.on('error_msg', (msg) => { alert(msg); location.reload(); });

    socket.on('game_start', ({ roomId }) => {
        currentRoomId = roomId;
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('gameArea').classList.remove('hidden');
        appendLog(`🎉 成功進入房間 [${roomId}]，對局開始！`);
    });

    socket.on('game_state_update', ({ myState, opState, isMyTurn }) => {
        document.getElementById('myHp').innerText = myState.hp;
        document.getElementById('opHp').innerText = opState.hp;

        const indicator = document.getElementById('turnIndicator');
        indicator.innerText = isMyTurn ? "⭐ 您的回合" : "⏳ 對手回合";
        indicator.style.color = isMyTurn ? "#4ade80" : "#f87171";

        const handDiv = document.getElementById('myHand');
        handDiv.innerHTML = "";
        myState.hand.forEach((card, idx) => {
            handDiv.innerHTML += `
                <div class="card" onclick="playCard(${idx})">
                    <div style="font-size:0.7em; font-weight:bold;">[${card.dynasty}]</div>
                    <div style="font-size:0.9em; font-weight:bold; color:#78350f;">${card.name}</div>
                    <div style="font-size:0.6em; color:#475569; overflow:hidden; max-height:35px;">${card.skill}</div>
                    <div style="font-size:0.65em; background:#fef3c7; font-weight:bold; color:#b45309;">HP: ${card.hp}</div>
                </div>`;
        });

        const myActive = document.getElementById('myActive');
        myActive.innerHTML = myState.active ? `
            <div class="card" style="border:3px solid #22c55e;" onclick="triggerAttack()">
                <div style="font-size:0.7em; font-weight:bold;">主戰英雄</div>
                <div style="font-size:0.9em; font-weight:bold; color:#78350f;">${myState.active.name}</div>
                <div style="font-size:0.6em; color:#475569;">${myState.active.skill}</div>
                <div style="font-size:0.65em; background:#dcfce7; color:#15803d; font-weight:bold;">⚔️ 點擊攻擊</div>
            </div>` : `<div style="color:#64748b; font-size:0.9rem;">請點選手牌部署主戰英雄</div>`;

        const opActive = document.getElementById('opActive');
        opActive.innerHTML = opState.active ? `
            <div class="card" style="border:3px solid #ef4444;">
                <div style="font-size:0.7em; font-weight:bold;">對手主戰</div>
                <div style="font-size:0.9em; font-weight:bold; color:#78350f;">${opState.active.name}</div>
                <div style="font-size:0.6em; color:#475569;">${opState.active.skill}</div>
                <div style="font-size:0.65em; background:#fee2e2; color:#991b1b; font-weight:bold;">HP: ${opState.active.hp}</div>
            </div>` : `<div style="color:#64748b; font-size:0.9rem;">對手尚未部署</div>`;
    });

    function playCard(cardIndex) { socket.emit('play_card', { roomId: currentRoomId, cardIndex }); }

    function triggerAttack() {
        const questions = [
            { q: "秦王政自認為「XX三皇，XX五帝」，合稱為「皇帝」：", ans: "功過三皇，德兼五帝", opts: ["A. 功過三皇，德兼五帝", "B. 德高三皇，功過五帝"] },
            { q: "漢武帝頒行哪一項法令削弱諸侯王勢力？", ans: "推恩令", opts: ["A. 削藩令", "B. 推恩令"] }
        ];
        let q = questions[Math.floor(Math.random() * questions.length)];
        document.getElementById('qText').innerText = q.q;
        const optDiv = document.getElementById('qOptions');
        optDiv.innerHTML = "";
        q.opts.forEach(opt => {
            let isCorrect = opt.includes(q.ans) || opt.charAt(0) === 'A';
            optDiv.innerHTML += `<button class="modal-btn" onclick="submitAnswer(${isCorrect})">${opt}</button>`;
        });
        document.getElementById('questionModal').classList.remove('hidden');
    }

    function submitAnswer(isCorrect) {
        document.getElementById('questionModal').classList.add('hidden');
        socket.emit('attack', { roomId: currentRoomId, answerCorrect: isCorrect });
    }

    function endTurn() { socket.emit('end_turn', currentRoomId); }

    socket.on('battle_log', (data) => { appendLog(data.msg); });
    socket.on('game_over', ({ winner }) => {
        alert(winner === socket.id ? "🎉 恭喜您獲得勝利！" : "❌ 可惜，勝敗乃兵家常事！");
        location.reload();
    });

    function appendLog(text) {
        const box = document.getElementById('logBox');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
