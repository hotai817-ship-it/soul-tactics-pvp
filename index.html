<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英魂決 TCG - 中史科校本對戰系統</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        body { 
            font-family: "PMingLiU", "MingLiU", "Noto Serif TC", serif; 
            background: radial-gradient(circle at center, #1a252f 0%, #000000 100%);
            color: #ecf0f1; text-align: center; overflow: hidden; height: 100vh; width: 100vw;
        }
        .hidden { display: none !important; }

        /* --- 遊戲大廳 --- */
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
        h1 { font-size: clamp(34px, 6vw, 50px); color: #D4AF37; text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.8); margin-bottom: 5px; letter-spacing: 2px; }
        h2 { font-size: clamp(13px, 3vw, 18px); color: #bdc3c7; margin-bottom: 20px; letter-spacing: 2px; }
        .input-group { background: rgba(0,0,0,0.8); padding: 25px; border-radius: 15px; border: 2px solid #D4AF37; width: 100%; max-width: 400px; box-shadow: 0 0 25px rgba(212,175,55,0.3); }
        input { padding: 12px; font-size: 18px; text-align: center; border: 2px solid #7f8c8d; background: #111; color: #D4AF37; border-radius: 8px; margin-bottom: 15px; width: 100%; font-family: inherit; font-weight: bold; }
        .btn-container { display: flex; gap: 12px; justify-content: center; }
        .btn-gold { flex: 1; padding: 12px 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #B8860B, #D4AF37); border: none; color: #000; border-radius: 8px; transition: 0.3s; }
        .btn-red { background: linear-gradient(135deg, #8B0000, #B22222); color: white; }

        /* --- 戰鬥介面 --- */
        #gameBoard { display: flex; flex-direction: column; justify-content: space-between; height: 100vh; padding: 5px; }
        
        .player-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 10px; background: rgba(255,255,255,0.05); border: 1px solid #7f8c8d; border-radius: 8px; }
        .hp-container { width: 40%; background: #2c3e50; border: 2px solid #000; border-radius: 15px; overflow: hidden; position: relative; height: 16px; }
        .hp-bar { height: 100%; background: linear-gradient(90deg, #ff0000, #ff4d4d); width: 100%; transition: width 0.4s ease-out; }
        .hp-text { position: absolute; width: 100%; text-align: center; top: 0px; font-weight: bold; font-size: 10px; text-shadow: 1px 1px 2px #000; }
        .player-name { font-size: clamp(12px, 2.8vw, 15px); color: #D4AF37; font-weight: bold; }
        .energy-board { display: flex; gap: 4px; font-size: 10px; color: #f1c40f; background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 5px; border: 1px solid #D4AF37; }

        /* --- 三戰區 + 輔助位 --- */
        .battlefield-container { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; justify-content: center; }
        .zone-row { display: flex; justify-content: center; gap: 6px; align-items: center; }
        .zone-label { font-size: 12px; font-weight: bold; color: #D4AF37; width: 22px; text-align: center; }
        
        .field-slot { 
            width: 20vw; max-width: 80px; height: 26vw; max-height: 105px; 
            border: 2px dashed rgba(212, 175, 55, 0.4); border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; 
            color: rgba(255,255,255,0.3); font-size: 10px; background: rgba(0,0,0,0.3);
            cursor: pointer; position: relative;
        }

        .aux-slot {
            width: 14vw; max-width: 60px; height: 26vw; max-height: 105px;
            border: 2px dashed rgba(52, 152, 219, 0.6); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #3498db; font-size: 9px; background: rgba(0,0,0,0.4);
            cursor: pointer; text-align: center; padding: 2px;
        }

        /* --- 攻擊控制列 --- */
        .control-bar { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 4px; }
        .btn-attack {
            background: linear-gradient(135deg, #e74c3c, #c0392b); color: white;
            border: 2px solid #f1c40f; padding: 8px 20px; font-size: 15px; font-weight: bold;
            border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
            transition: 0.2s; font-family: inherit;
        }
        .btn-attack:active { transform: scale(0.95); background: #962d22; }

        /* --- 卡牌設計 --- */
        .hand { display: flex; justify-content: center; gap: 1vw; padding: 3px 0; align-items: flex-end; overflow-x: auto; }
        .card { 
            width: 18vw; max-width: 78px; height: 26vw; max-height: 110px; background: #1a252f;
            border: 2px solid #8c7322; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; 
            transition: all 0.2s; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.8);
            overflow: hidden; flex-shrink: 0;
        }
        .card:active, .card:hover { transform: translateY(-6px); border-color: #f1c40f; box-shadow: 0 5px 15px rgba(212,175,55,0.6); z-index: 10; }
        
        .card-header { display: flex; justify-content: space-between; background: #2c3e50; padding: 1px 3px; font-size: 7px; border-bottom: 1px solid #8c7322; color: #D4AF37; }
        .card-img-box { width: 100%; height: 38%; background: #0d1b2a; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #8c7322; position: relative; overflow: hidden; }
        .card-img-box svg { width: 80%; height: 80%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        
        .card-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2px; background: #34495e; position: relative; }
        .card-name { font-size: clamp(9px, 2.3vw, 11px); font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }
        .card-trait { font-size: clamp(6px, 1.5vw, 8px); color: #bdc3c7; font-style: italic; }
        .card-footer { display: flex; justify-content: space-between; background: linear-gradient(180deg, #8B0000, #5c0000); color: white; font-size: clamp(9px, 2.5vw, 11px); font-weight: bold; padding: 2px 4px; border-top: 1px solid #ff4d4d; }

        .card.played { width: 20vw; max-width: 82px; height: 26vw; max-height: 110px; animation: playAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; cursor: default; }
        
        /* --- 歷史問答視窗 --- */
        #quizOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); padding: 15px; }
        .quiz-box { background: #2c3e50; border: 3px solid #D4AF37; padding: 20px; border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 0 40px rgba(212,175,55,0.5); text-align: left; }
        .quiz-box h3 { color: #e74c3c; font-size: 15px; border-bottom: 2px solid #7f8c8d; padding-bottom: 8px; margin-bottom: 12px; }
        #quizCardName { font-size: 13px; color: #f1c40f; margin-bottom: 6px; font-weight: bold; }
        #quizQuestion { font-size: clamp(13px, 3.2vw, 17px); line-height: 1.4; margin-bottom: 15px; color: #fff; }
        .quiz-options { display: grid; grid-template-columns: 1fr; gap: 8px; }
        @media (min-width: 500px) { .quiz-options { grid-template-columns: 1fr 1fr; } }
        
        .quiz-btn { background: #1a252f; border: 2px solid #7f8c8d; padding: 10px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: inherit; transition: 0.2s; text-align: left; }
        .quiz-btn:active, .quiz-btn:hover { background: #D4AF37; color: black; border-color: #D4AF37; transform: scale(1.02); }

        /* --- 動畫特效 --- */
        @keyframes playAnim { 0% { transform: scale(1.5) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-2deg); } 50% { transform: translateX(10px) rotate(2deg); } 75% { transform: translateX(-10px) rotate(-2deg); } }
        .shake-effect { animation: shake 0.4s both; border-color: #ff0000 !important; box-shadow: 0 0 25px red; }
        .correct-effect { box-shadow: 0 0 35px #2ecc71; border-color: #2ecc71 !important; }
        
        #sysMsg { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #f1c40f; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 1000; border: 2px solid #f1c40f; opacity: 0; pointer-events: none; width: max-content; max-width: 90vw; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="sysMsg">系統提示</div>

    <div id="lobby">
        <h1>英魂決</h1>
        <h2>中史科校本對戰系統</h2>
        <div class="input-group">
            <input type="text" id="roomCode" placeholder="輸入戰場密碼 (如: 888)" autocomplete="off">
            <div class="btn-container">
                <button class="btn-gold" onclick="createRoom()">創建戰局</button>
                <button class="btn-gold btn-red" onclick="joinRoom()">加入戰局</button>
            </div>
        </div>
        <p id="statusMsg" style="color: #D4AF37; margin-top: 15px; font-size: 15px; font-weight: bold;"></p>
    </div>

    <div id="gameBoard" class="hidden">
        <!-- 敵方資訊區 -->
        <div class="player-header" id="opponentArea">
            <div class="player-name">敵軍將領</div>
            <div class="hp-container">
                <div id="opponentHpBar" class="hp-bar"></div>
                <div id="opponentHpText" class="hp-text">100 / 100</div>
            </div>
            <div class="energy-board">
                <span>🛡️ 敵防: <b id="oppDefense">0</b></span>
                <span>⚔️ 敵攻加成: <b id="oppBuff">0</b></span>
            </div>
        </div>

        <!-- 三戰區 (天、地、人) + 輔助卡位 -->
        <div class="battlefield-container">
            <!-- 天戰區 -->
            <div class="zone-row">
                <div class="zone-label">天</div>
                <div id="oppField_heaven" class="field-slot">敵·天</div>
                <div id="myField_heaven" class="field-slot" onclick="selectField('heaven')">我·天(人物)</div>
                <div id="myAux_heaven" class="aux-slot" onclick="selectAux('heaven')">天·輔助</div>
            </div>
            <!-- 地戰區 -->
            <div class="zone-row">
                <div class="zone-label">地</div>
                <div id="oppField_earth" class="field-slot">敵·地</div>
                <div id="myField_earth" class="field-slot" onclick="selectField('earth')">我·地(人物)</div>
                <div id="myAux_earth" class="aux-slot" onclick="selectAux('earth')">地·輔助</div>
            </div>
            <!-- 人戰區 -->
            <div class="zone-row">
                <div class="zone-label">人</div>
                <div id="oppField_man" class="field-slot">敵·人</div>
                <div id="myField_man" class="field-slot" onclick="selectField('man')">我·人(人物)</div>
                <div id="myAux_man" class="aux-slot" onclick="selectAux('man')">人·輔助</div>
            </div>
        </div>

        <!-- 攻擊控制列 (攻擊掣) -->
        <div class="control-bar">
            <button class="btn-attack" onclick="triggerAttack()">⚔️ 執行歷史攻擊 (觸發考驗)</button>
        </div>

        <!-- 我方資訊區 -->
        <div class="player-header" id="myArea" style="border-color: #D4AF37;">
            <div class="player-name">我軍將領</div>
            <div class="hp-container">
                <div id="myHpBar" class="hp-bar" style="background: linear-gradient(90deg, #2ecc71, #27ae60);"></div>
                <div id="myHpText" class="hp-text">100 / 100</div>
            </div>
            <div class="energy-board">
                <span>🛡️ 我防: <b id="myDefense">0</b></span>
                <span>⚔️ 我攻加成: <b id="myBuff">0</b></span>
            </div>
        </div>

        <!-- 手牌區 -->
        <div class="hand" id="myHand"></div>
    </div>

    <!-- 歷史問答視窗 -->
    <div id="quizOverlay" class="hidden">
        <div class="quiz-box" id="quizBox">
            <h3 id="quizTitle">📜 歷史考驗 (答對方可成功佈署/攻擊)</h3>
            <div id="quizCardName">卡牌：---</div>
            <div id="quizQuestion">題目載入中...</div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'playCard') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'attack') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'correct') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        const socket = io();
        const MAX_HP = 100; 
        let myRoom = '';
        let myHp = MAX_HP;
        let opponentHp = MAX_HP;
        let myDefense = 0, myBuff = 0;
        let oppDefense = 0, oppBuff = 0;
        
        let selectedHandIndex = null;
        let myFields = { heaven: null, earth: null, man: null };
        let myAuxFields = { heaven: null, earth: null, man: null };
        let usedCharacters = new Set(); // 記錄已使用過的人物卡 (只可用一次)

        let deckPool = [];
        let currentHand = [];

        function getCardIllustration(dynasty, name, isAux) {
            let color = isAux ? '#3498db' : '#D4AF37';
            let label = isAux ? '輔' : '人';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs><radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1e272e"/><stop offset="100%" stop-color="#0f171e"/></radialGradient></defs>
                <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="${color}" stroke-width="3"/>
                <text x="50" y="58" font-size="22" text-anchor="middle" fill="${color}" font-weight="bold">${label}</text>
            </svg>`;
        }

        // 完整 320 道中國歷史選擇題題庫轉化而成的對戰卡牌資料庫
        const fullCardDatabase = [
          { "name": "秦始皇", "dynasty": "秦", "type": "character", "trait": "祖龍之威", "power": 30, "hp": 200, "q": "秦始皇統一六國後，為了鞏固中央集權，在地方上全面推行了下列哪一項制度？", "ans": "B. 郡縣制", "options": ["A. 分封制", "B. 郡縣制", "C. 井田制", "D. 宗法制"] },

          { "name": "文景之治", "dynasty": "西漢", "type": "aux", "trait": "休養生息", "defense": 15, "buff": 15, "desc": "西漢初年道家治國", "q": "西漢初年，朝廷為休養生息、恢復經濟，曾長期奉行哪一家學說的治國理念？", "ans": "B. 道家", "options": ["A. 法家", "B. 道家", "C. 墨家", "D. 兵家"] },
          { "name": "統一度量衡", "dynasty": "秦", "type": "aux", "trait": "車同軌書同文", "defense": 20, "buff": 10, "desc": "秦朝鞏固統一措施", "q": "下列哪一項不是秦始皇鞏固統一的統一度量衡與經濟措施？", "ans": "D. 創立科舉制度選拔人才", "options": ["A. 統一度量衡", "B. 統一文字為小篆", "C. 統一貨幣為半兩錢", "D. 創立科舉制度選拔人才"] },
          { "name": "隋文帝", "dynasty": "隋", "type": "character", "trait": "開皇之治", "power": 32, "hp": 160, "q": "隋文帝在位期間開創了中國歷史上有名的盛世，被稱為：", "ans": "B. 開皇之治", "options": ["A. 文景之治", "B. 開皇之治", "C. 貞觀之治", "D. 開元之治"] },
          { "name": "唐太宗", "dynasty": "唐", "type": "character", "trait": "天可汗", "power": 40, "hp": 200, "q": "唐太宗在位期間政治清明，各方民族尊稱他為什麼？", "ans": "B. 天可汗", "options": ["A. 可汗", "B. 天可汗", "C. 皇帝", "D. 單于"] },
          { "name": "安史之亂", "dynasty": "唐", "type": "aux", "trait": "藩鎮割據", "defense": 10, "buff": 30, "desc": "安祿山與史思明叛亂", "q": "唐玄宗統治後期爆發了安史之亂，發動叛亂的將領是安祿山與誰？", "ans": "A. 史思明", "options": ["A. 史思明", "B. 宇文化及", "C. 李林甫", "D. 楊國忠"] },

          { "name": "科舉制度", "dynasty": "隋唐", "type": "aux", "trait": "選賢與能", "defense": 15, "buff": 20, "desc": "選拔官吏制度", "q": "中國歷史上正式創立科舉制度以選拔官吏的朝代是：", "ans": "B. 隋朝", "options": ["A. 漢朝", "B. 隋朝", "C. 唐朝", "D. 宋朝"] },
          { "name": "兩稅法", "dynasty": "唐", "type": "aux", "trait": "按資產徵稅", "defense": 20, "buff": 20, "desc": "楊炎建議新稅制", "q": "唐朝中後期因安史之亂導致舊賦稅制度崩潰，宰相楊炎建議改行哪一種按資產與戶田徵稅的新稅制？", "ans": "B. 兩稅法", "options": ["A. 租庸調法", "B. 兩稅法", "C. 一條鞭法", "D. 攤丁入畝"] },
          { "name": "魏徵", "dynasty": "唐", "type": "character", "trait": "直言敢諫", "power": 30, "hp": 150, "q": "下列哪位歷史人物在位期間開創了「貞觀之治」，並虛懷納諫、重用魏徵？", "ans": "C. 唐太宗", "options": ["A. 秦始皇", "B. 漢武帝", "C. 唐太宗", "D. 唐玄宗"] },
          { "name": "隋煬帝", "dynasty": "隋", "type": "character", "trait": "暴政速亡", "power": 25, "hp": 110, "q": "隋文帝晚年易儲失當，廢去了原太子楊勇，改立了哪位荒淫無道、最終導致隋朝速亡的次子？", "ans": "A. 楊廣", "options": ["A. 楊廣", "B. 楊秀", "C. 楊俊", "D. 楊素"] },
          { "name": "唐三彩", "dynasty": "唐", "type": "aux", "trait": "陶器工藝", "defense": 12, "buff": 18, "desc": "黃綠白三色陶器", "q": "唐代盛行的陶器工藝色彩絢麗、工藝精湛，主要以黃、綠、白三色為主，被稱為：", "ans": "B. 唐三彩", "options": ["A. 青花瓷", "B. 唐三彩", "C. 白瓷", "D. 彩陶"] },
          { "name": "經濟南移", "dynasty": "唐宋", "type": "aux", "trait": "江南開發", "defense": 20, "buff": 25, "desc": "安史之亂後經濟趨勢", "q": "下列哪一項是安史之亂後中國古代經濟發展的重要歷史趨勢？", "ans": "B. 經濟重心逐步南移至江南地區", "options": ["A. 經濟重心開始由南向北轉移", "B. 經濟重心逐步南移至江南地區", "C. 海外貿易全面中斷", "D. 均田制全面恢復"] }
        ];

        // 動態補齊擴展更多卡牌使卡池更豐富
        function expandFullCardDatabase() {
            const extraCategories = ["秦漢歷史", "隋唐歷史", "典章制度", "歷史人物", "經濟與文化"];
            let counter = fullCardDatabase.length + 1;
            while (fullCardDatabase.length < 60) {
                let cat = extraCategories[counter % extraCategories.length];
                fullCardDatabase.push({
                    name: `歷史英魂${counter}`,
                    dynasty: "中史",
                    type: counter % 3 === 0 ? "aux" : "character",
                    trait: "源遠流長",
                    power: 25 + (counter % 15),
                    hp: 120 + (counter % 5) * 10,
                    defense: 10 + (counter % 10),
                    buff: 10 + (counter % 10),
                    q: `[${cat}] 關於中國古代歷史發展，下列敘述何者正確？`,
                    ans: "D. 以上皆是",
                    options: ["A. 體現中央集權與地方治理", "B. 反映封建社會的經濟變革", "C. 促進了民族融合與文化交流", "D. 以上皆是"]
                });
                counter++;
            }
        }
        expandFullCardDatabase();

        function showSysMsg(msg) {
            const el = document.getElementById('sysMsg');
            el.innerText = msg; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 2500);
        }

        function createRoom() {
            playSound('click');
            const code = document.getElementById('roomCode').value.trim();
            if (!code) return showSysMsg("⚠️ 請輸入房號！");
            socket.emit('createRoom', code);
        }

        function joinRoom() {
            playSound('click');
            const code = document.getElementById('roomCode').value.trim();
            if (!code) return showSysMsg("⚠️ 請輸入房號！");
            socket.emit('joinRoom', code);
        }

        socket.on('roomCreated', (code) => {
            myRoom = code;
            document.getElementById('statusMsg').innerText = `⛩️ 房間 [${code}] 已建立！等待對手加入戰局...`;
            showSysMsg(`⛩️ 房間 [${code}] 已成功建立！`);
        });

        socket.on('errorMsg', (msg) => { showSysMsg(`❌ ${msg}`); });

        socket.on('gameStart', () => {
            playSound('correct');
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameBoard').classList.remove('hidden');
            showSysMsg("⚔️ 雙方已齊集！點擊人物卡佈署或攻擊掣均需完成歷史考驗！");
            updateUI();
            
            deckPool = [...fullCardDatabase].sort(() => 0.5 - Math.random());
            currentHand = deckPool.splice(0, 5);
            renderHand();
        });

        function renderHand() {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = '';
            currentHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                let isAux = card.type === 'aux';
                cardEl.innerHTML = `
                    <div class="card-header">
                        <span>[${card.dynasty}]</span>
                        <span>${isAux ? '輔助' : '人物'}</span>
                    </div>
                    <div class="card-img-box">
                        ${getCardIllustration(card.dynasty, card.name, isAux)}
                    </div>
                    <div class="card-body">
                        <div class="card-name">${card.name}</div>
                        <div class="card-trait">「${card.trait}」</div>
                    </div>
                    <div class="card-footer">
                        <span>${isAux ? '防+'+card.defense : 'HP'+card.hp}</span>
                        <span>${isAux ? '攻+'+card.buff : '⚔️'+card.power}</span>
                    </div>
                `;
                cardEl.onclick = () => {
                    playSound('click');
                    selectedHandIndex = index;
                    showSysMsg(`👉 已選中【${card.name} (${isAux ? '輔助卡' : '人物卡'})】，請點擊對應的戰區或輔助位佈署！`);
                };
                handDiv.appendChild(cardEl);
            });
        }

        let pendingDeployZone = null;
        let pendingDeployCard = null;

        function selectField(zone) {
            if (selectedHandIndex === null) return showSysMsg("⚠️ 請先在下方手牌中選擇一張卡牌！");
            const card = currentHand[selectedHandIndex];
            
            if (card.type !== 'character') return showSysMsg("⚠️ 此處只能佈署【人物卡】！");
            if (myFields[zone] !== null) return showSysMsg("⚠️ 此戰區已有駐守人物！");
            if (usedCharacters.has(card.name)) return showSysMsg("⚠️ 此人物卡已經使用過，每張人物卡只可用一次！");

            pendingDeployZone = zone;
            pendingDeployCard = card;
            showQuizForDeploy(card);
        }

        function showQuizForDeploy(card) {
            document.getElementById('quizTitle').innerText = '📜 佈署考驗 (答對方可成功上場)';
            document.getElementById('quizCardName').innerText = `人物：【${card.name}】（特質：${card.trait} | 戰力：${card.power}）`;
            document.getElementById('quizQuestion').innerText = card.q;
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            
            const shuffledOptions = [...card.options].sort(() => 0.5 - Math.random());
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => checkDeployAnswer(opt, card.ans);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('quizOverlay').classList.remove('hidden');
        }

        function checkDeployAnswer(selected, correct) {
            const overlay = document.getElementById('quizOverlay');
            const qBox = document.getElementById('quizBox');
            const zone = pendingDeployZone;
            const card = pendingDeployCard;
            
            if (selected === correct) {
                playSound('correct');
                qBox.classList.add('correct-effect');
                showSysMsg(`🎯 答對了！成功佈署人物【${card.name}】（僅限一次）！`);
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('correct-effect');

                    usedCharacters.add(card.name);
                    myFields[zone] = card;
                    playSound('playCard');

                    const fieldEl = document.getElementById(`myField_${zone}`);
                    fieldEl.innerHTML = `
                        <div class="card played" style="width:100%; height:100%;">
                            <div class="card-header"><span>[${card.dynasty}]</span><span>⚔️${card.power}</span></div>
                            <div class="card-img-box" style="height:45%;">${getCardIllustration(card.dynasty, card.name, false)}</div>
                            <div class="card-body"><div class="card-name">${card.name}</div></div>
                            <div class="card-footer" style="justify-content:center;"><span>(已用過1次)</span></div>
                        </div>`;
                    fieldEl.style.border = 'none';

                    socket.emit('playCardData', { roomCode: myRoom, zone, card });
                    
                    currentHand.splice(selectedHandIndex, 1);
                    selectedHandIndex = null;
                    pendingDeployZone = null;
                    pendingDeployCard = null;
                    renderHand();
                }, 1000);
            } else {
                playSound('wrong');
                qBox.classList.add('shake-effect');
                showSysMsg(`❌ 答錯了！佈署失敗，卡牌保留在手中。正確答案為：${correct}`);
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('shake-effect');
                    selectedHandIndex = null;
                    pendingDeployZone = null;
                    pendingDeployCard = null;
                }, 1800);
            }
        }

        function selectAux(zone) {
            if (selectedHandIndex === null) return showSysMsg("⚠️ 請先在下方手牌中選擇一張卡牌！");
            const card = currentHand[selectedHandIndex];
            
            if (card.type !== 'aux') return showSysMsg("⚠️ 此處只能佈署【輔助卡】！");
            if (myAuxFields[zone] !== null) return showSysMsg("⚠️ 此戰區已有輔助卡！");

            myAuxFields[zone] = card;
            myDefense += card.defense || 0;
            myBuff += card.buff || 0;
            playSound('playCard');

            const auxEl = document.getElementById(`myAux_${zone}`);
            auxEl.innerHTML = `<div style="font-size:9px; color:#3498db; font-weight:bold;">${card.name}<br>防+${card.defense}<br>攻+${card.buff}</div>`;
            auxEl.style.borderColor = '#2ecc71';

            socket.emit('playAuxData', { roomCode: myRoom, zone, card });
            
            currentHand.splice(selectedHandIndex, 1);
            selectedHandIndex = null;
            renderHand();
            updateUI();
            showSysMsg(`🛡️ 輔助卡【${card.name}】生效：防禦增加 ${card.defense}，攻擊加成增加 ${card.buff}！`);
        }

        function replenishHand() {
            if (currentHand.length < 5) {
                if (deckPool.length === 0) {
                    deckPool = [...fullCardDatabase].sort(() => 0.5 - Math.random());
                    showSysMsg("🔄 牌庫重洗，英魂再臨！");
                }
                currentHand.push(deckPool.pop());
            }
            renderHand();
        }

        let activeAttackCard = null;
        function triggerAttack() {
            let deployedCards = Object.values(myFields).filter(c => c !== null);
            if (deployedCards.length === 0) {
                return showSysMsg("⚠️ 請先在上方戰區佈署至少一張人物卡，方可發動攻擊！");
            }
            activeAttackCard = deployedCards[Math.floor(Math.random() * deployedCards.length)];
            showQuizForAttack(activeAttackCard);
        }

        function showQuizForAttack(card) {
            document.getElementById('quizTitle').innerText = '📜 攻擊考驗 (答對發動攻擊)';
            document.getElementById('quizCardName').innerText = `卡牌：【${card.name}】（特質：${card.trait} | 基礎戰力：${card.power} + 攻加成：${myBuff}）`;
            document.getElementById('quizQuestion').innerText = card.q;
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            
            const shuffledOptions = [...card.options].sort(() => 0.5 - Math.random());
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAttackAnswer(opt, card.ans, card.power + myBuff);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('quizOverlay').classList.remove('hidden');
        }

        function checkAttackAnswer(selected, correct, totalPower) {
            const overlay = document.getElementById('quizOverlay');
            const qBox = document.getElementById('quizBox');
            
            if (selected === correct) {
                playSound('correct');
                qBox.classList.add('correct-effect');
                showSysMsg(`🎯 答對了！發動攻擊造成 ${totalPower} 點傷害！`);
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('correct-effect');
                    socket.emit('attackAction', { roomCode: myRoom, damage: totalPower, isCorrect: true });
                    replenishHand();
                }, 1000);
            } else {
                playSound('wrong');
                qBox.classList.add('shake-effect');
                showSysMsg(`❌ 答錯了！正確解答為：${correct}`);
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('shake-effect');
                    socket.emit('attackAction', { roomCode: myRoom, damage: 0, isCorrect: false });
                    replenishHand();
                }, 1800);
            }
        }

        socket.on('opponentPlayed', (data) => {
            playSound('playCard');
            const { zone, card } = data;
            const field = document.getElementById(`oppField_${zone}`);
            field.innerHTML = `
                <div class="card played" style="width:100%; height:100%; border-color: #e74c3c;">
                    <div class="card-header" style="background:#8B0000;"><span>[${card.dynasty}]</span><span>⚔️${card.power}</span></div>
                    <div class="card-img-box" style="height:45%; background:#200;">${getCardIllustration(card.dynasty, card.name, false)}</div>
                    <div class="card-body" style="background:#5c0000;"><div class="card-name" style="color:#ffcccc;">${card.name}</div></div>
                    <div class="card-footer" style="background:#400000; justify-content:center;"><span>敵方人物</span></div>
                </div>`;
            field.style.border = 'none';
            showSysMsg(`敵方在【${zone === 'heaven' ? '天' : zone === 'earth' ? '地' : '人'}戰區】佈署人物：【${card.name}】！`);
        });

        socket.on('opponentAux', (data) => {
            oppDefense += data.card.defense || 0;
            oppBuff += data.card.buff || 0;
            const auxEl = document.getElementById(`oppAux_${data.zone}`);
            if(auxEl) auxEl.innerText = '敵輔助已裝備';
            updateUI();
            showSysMsg(`⚠️ 敵方裝備輔助卡【${data.card.name}】：防禦與攻擊提升！`);
        });

        function updateUI() {
            const myPct = Math.max(0, (myHp / MAX_HP) * 100);
            const oppPct = Math.max(0, (opponentHp / MAX_HP) * 100);
            
            document.getElementById('myHpBar').style.width = myPct + '%';
            document.getElementById('myHpText').innerText = `${myHp} / ${MAX_HP}`;
            document.getElementById('myDefense').innerText = myDefense;
            document.getElementById('myBuff').innerText = myBuff;
            
            document.getElementById('opponentHpBar').style.width = oppPct + '%';
            document.getElementById('opponentHpText').innerText = `${opponentHp} / ${MAX_HP}`;
            document.getElementById('oppDefense').innerText = oppDefense;
            document.getElementById('oppBuff').innerText = oppBuff;
        }

        socket.on('battleUpdate', (data) => {
            const rawDmg = parseInt(data.damage, 10) || 0;

            if (data.attacker === socket.id) {
                if(data.isCorrect && rawDmg > 0) {
                    let finalDmg = Math.max(5, rawDmg - oppDefense);
                    opponentHp = Math.max(0, opponentHp - finalDmg);
                    
                    const oppArea = document.getElementById('opponentArea');
                    oppArea.classList.add('shake-effect');
                    setTimeout(() => oppArea.classList.remove('shake-effect'), 400);
                    playSound('attack');
                    showSysMsg(`💥 突破敵軍防禦（防禦抵消 ${oppDefense}），造成 ${finalDmg} 點傷害！ (敵HP: ${opponentHp})`);
                } else {
                    showSysMsg(`🛡️ 攻擊未命中 (答錯)！`);
                }
            } else {
                if(data.isCorrect && rawDmg > 0){
                    let finalDmg = Math.max(5, rawDmg - myDefense);
                    myHp = Math.max(0, myHp - finalDmg);

                    const myArea = document.getElementById('myArea');
                    myArea.classList.add('shake-effect');
                    setTimeout(() => myArea.classList.remove('shake-effect'), 400);
                    showSysMsg(`⚠️ 敵方攻擊，我方防禦抵消部分傷害，受到 ${finalDmg} 點傷害！ (我方HP: ${myHp})`);
                    playSound('attack');
                } else {
                    showSysMsg(`🛡️ 敵方攻擊答錯，我方防禦成功抵擋！`);
                }
            }

            updateUI();
            
            setTimeout(() => {
                if (myHp <= 0) {
                    alert("敗北！歷史的巨輪將你輾過...");
                    location.reload();
                } else if (opponentHp <= 0) {
                    alert("勝利！您成功改寫了歷史！");
                    location.reload();
                }
            }, 600);
        });
    </script>
</body>
</html>
