<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英魂決 TCG - 傳奇對決版</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* 核心重置與字體設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: "PMingLiU", "MingLiU", "Noto Serif TC", serif; 
            background: radial-gradient(circle at center, #1a1e29 0%, #05070a 100%);
            color: #ecf0f1; text-align: center; overflow: hidden; height: 100vh; 
        }
        .hidden { display: none !important; }

        /* 大廳樣式 */
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-image: radial-gradient(rgba(212, 175, 55, 0.1) 1px, transparent 1px); background-size: 30px 30px; }
        h1 { font-size: 70px; color: #f1c40f; text-shadow: 0 0 20px rgba(241, 196, 15, 0.6); margin-bottom: 10px; letter-spacing: 5px; }
        h2 { font-size: 20px; color: #bdc3c7; letter-spacing: 3px; margin-bottom: 40px; }
        .input-group { background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px; border: 1px solid #34495e; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        input { padding: 15px; font-size: 22px; text-align: center; border: 2px solid #555; background: #222; color: #f1c40f; border-radius: 8px; margin-bottom: 25px; width: 280px; transition: 0.3s; }
        input:focus { outline: none; border-color: #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.4); }
        .btn-gold { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #f1c40f, #f39c12); border: none; color: #111; border-radius: 8px; margin: 5px; transition: 0.3s; box-shadow: 0 4px 15px rgba(241,196,15,0.3); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(241,196,15,0.6); }

        /* 戰鬥介面 (仿 PTCG 桌面) */
        #gameBoard { display: flex; flex-direction: column; justify-content: space-between; height: 100vh; padding: 10px 20px; perspective: 1000px; }
        
        /* 玩家資訊列 (血量) */
        .player-info { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent); border-left: 5px solid #e74c3c; border-radius: 5px; margin: 5px 0; }
        #myArea { border-left-color: #2ecc71; background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent); }
        .hp-container { width: 300px; background: #222; border-radius: 15px; height: 25px; position: relative; border: 2px solid #555; overflow: hidden; }
        .hp-bar { height: 100%; background: linear-gradient(90deg, #e74c3c, #c0392b); width: 100%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #myHpBar { background: linear-gradient(90deg, #2ecc71, #27ae60); }
        .hp-text { position: absolute; top: 2px; width: 100%; text-align: center; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px #000; }
        
        /* 戰場中央 (出戰區 Active Slot) */
        .battlefield { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%); }
        .active-slot { width: 150px; height: 210px; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(0,0,0,0.3); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        
        /* 攻擊按鈕 (附在出戰區旁) */
        .attack-btn { position: absolute; right: -120px; top: 50%; transform: translateY(-50%); background: #e74c3c; border: 2px solid #c0392b; color: white; padding: 15px; border-radius: 50%; width: 80px; height: 80px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 20px rgba(231,76,60,0.5); transition: 0.3s; display: none; }
        .attack-btn:hover { background: #ff4d4d; box-shadow: 0 0 30px #ff4d4d; transform: translateY(-50%) scale(1.1); }

        /* 卡牌設計 - 全息閃卡特效 */
        .hand { display: flex; justify-content: center; gap: 10px; height: 180px; align-items: flex-end; padding-bottom: 10px; }
        .card { 
            width: 120px; height: 175px; background: #1a1a2e; border: 2px solid #7f8c8d; border-radius: 8px; cursor: pointer; 
            display: flex; flex-direction: column; transition: all 0.3s; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .card:hover { transform: translateY(-15px); border-color: #f1c40f; box-shadow: 0 10px 25px rgba(241,196,15,0.4); z-index: 10; }
        
        /* 閃卡光澤動畫 (Holo Foil) */
        .card::after {
            content: ""; position: absolute; top: -100%; left: -100%; width: 50%; height: 300%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg); transition: 0.5s; opacity: 0; pointer-events: none;
        }
        .card:hover::after { left: 150%; opacity: 1; transition: 0.8s ease-in-out; }

        .card-image { width: 100%; height: 90px; background-size: cover; background-position: center; border-bottom: 2px solid #555; position: relative; }
        .card-name-mask { position: absolute; bottom: 0; width: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent); color: #f1c40f; font-size: 16px; font-weight: bold; padding: 5px 0 2px; }
        .card-trait { font-size: 12px; color: #aaa; margin-top: 4px; padding: 0 4px; }
        .card-power { position: absolute; bottom: 0; width: 100%; background: #2c3e50; color: white; font-size: 16px; font-weight: bold; padding: 4px 0; border-top: 1px solid #555; }
        
        .played { pointer-events: none; width: 140px; height: 200px; box-shadow: 0 0 20px rgba(241,196,15,0.5); border-color: #f1c40f; animation: dropIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .played .card-image { height: 110px; }
        .played .card-power { background: #8B0000; font-size: 18px; }

        /* 卡牌詳情檢視器 (PTCG 放大看卡功能) */
        #cardZoomModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(5px); }
        .zoom-card-container { display: flex; gap: 40px; align-items: center; }
        .zoom-card { width: 300px; height: 420px; background: #111; border: 4px solid #f1c40f; border-radius: 15px; overflow: hidden; box-shadow: 0 0 50px rgba(241,196,15,0.4); position: relative; }
        .zoom-image { width: 100%; height: 220px; background-size: cover; background-position: top; }
        .zoom-info { padding: 15px; text-align: left; }
        .zoom-name { font-size: 28px; color: #f1c40f; margin-bottom: 5px; border-bottom: 2px solid #555; padding-bottom: 5px; }
        .zoom-trait { font-size: 16px; color: #bdc3c7; font-style: italic; margin-bottom: 20px; }
        .zoom-desc { font-size: 16px; color: #ecf0f1; line-height: 1.5; }
        .zoom-power { position: absolute; bottom: 0; left: 0; width: 100%; background: #8B0000; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; border-top: 2px solid #ff4d4d; }
        
        .zoom-actions { display: flex; flex-direction: column; gap: 15px; }
        .btn-play { background: #2ecc71; color: #111; font-size: 24px; padding: 15px 40px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(46,204,113,0.5); transition: 0.2s; }
        .btn-play:hover { background: #27ae60; transform: scale(1.05); }
        .btn-cancel { background: #555; color: white; font-size: 20px; padding: 12px 40px; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-cancel:hover { background: #777; }

        /* 問答視窗 */
        #quizOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 300; }
        .quiz-box { background: #1a252f; border: 3px solid #3498db; padding: 40px; border-radius: 15px; width: 600px; text-align: left; box-shadow: 0 0 40px rgba(52,152,219,0.4); }
        #quizQuestion { font-size: 26px; line-height: 1.5; margin-bottom: 30px; color: white; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .quiz-btn { background: #2c3e50; border: 2px solid #555; padding: 15px; color: white; font-size: 20px; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .quiz-btn:hover { background: #3498db; border-color: #3498db; box-shadow: 0 0 15px #3498db; }

        /* 特效 */
        @keyframes dropIn { 0% { transform: scale(1.5) translateY(50px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .shake-effect { animation: shake 0.4s both; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } }
        
        #sysMsg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #f1c40f; padding: 12px 30px; border-radius: 30px; font-size: 18px; z-index: 1000; border: 1px solid #f1c40f; opacity: 0; transition: 0.3s; pointer-events: none; }
    </style>
</head>
<body>

    <div id="sysMsg">系統提示</div>

    <!-- 遊戲大廳 -->
    <div id="lobby">
        <h1>英魂決 TCG</h1>
        <h2>校本中史科・卡牌對戰系統</h2>
        <div class="input-group">
            <input type="text" id="roomCode" placeholder="輸入戰局代碼 (如: 888)" autocomplete="off">
            <br>
            <button class="btn-gold" onclick="createRoom()">創建戰局</button>
            <button class="btn-gold" style="background: linear-gradient(135deg, #3498db, #2980b9); color: white;" onclick="joinRoom()">加入戰局</button>
        </div>
        <p id="statusMsg" style="color: #f1c40f; margin-top: 20px; font-size: 18px;"></p>
    </div>

    <!-- 卡牌檢視器 (Zoom Modal) -->
    <div id="cardZoomModal" class="hidden">
        <div class="zoom-card-container">
            <div class="zoom-card" id="zoomCardEl">
                <!-- 動態注入內容 -->
            </div>
            <div class="zoom-actions">
                <button class="btn-play" onclick="confirmPlayCard()">出戰 (Set Active)</button>
                <button class="btn-cancel" onclick="closeZoomModal()">取消 (Cancel)</button>
            </div>
        </div>
    </div>

    <!-- 遊戲對戰區 -->
    <div id="gameBoard" class="hidden">
        <!-- 敵方區域 -->
        <div class="player-info" id="opponentArea">
            <span class="player-name">敵軍將領</span>
            <div class="hp-container"><div id="opponentHpBar" class="hp-bar"></div><div id="opponentHpText" class="hp-text">100 / 100</div></div>
        </div>

        <!-- 戰場中央交鋒區 -->
        <div class="battlefield">
            <!-- 敵方出戰卡牌 -->
            <div class="active-slot" id="opponentActive">
                <span style="color: #555;">敵方出戰區</span>
            </div>
            
            <!-- 我方出戰卡牌 -->
            <div class="active-slot" id="myActive">
                <span style="color: #555;">我方出戰區</span>
                <button class="attack-btn" id="attackBtn" onclick="triggerAttack()">發動<br>攻擊</button>
            </div>
        </div>

        <!-- 我方區域與手牌 -->
        <div class="player-info" id="myArea">
            <span class="player-name" style="color:#2ecc71;">我軍將領</span>
            <div class="hp-container"><div id="myHpBar" class="hp-bar"></div><div id="myHpText" class="hp-text">100 / 100</div></div>
        </div>
        <div class="hand" id="myHand"></div>
    </div>

    <!-- 歷史問答視窗 -->
    <div id="quizOverlay" class="hidden">
        <div class="quiz-box" id="quizBox">
            <h3 style="color:#3498db; border-bottom: 1px solid #555; padding-bottom: 10px; margin-bottom: 20px;">📜 歷史考驗 (答對才能成功施放攻擊)</h3>
            <div id="quizQuestion">題目載入中...</div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>
    </div>

    <script>
        // 音效系統
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); }
            else if (type === 'zoom') { osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(400, now + 0.15); gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15); }
            else if (type === 'playCard') { osc.type = 'square'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.3); gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3); }
            else if (type === 'attack') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.4); gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
        }

        const socket = io();
        const MAX_HP = 100;
        let myRoom = '';
        let myHp = MAX_HP;
        let opponentHp = MAX_HP;
        let pendingDamage = 0;
        let selectedHandIndex = -1;
        let currentHandCards = [];

        // 📚 題庫資料 (可自行擴充)
        const questionBank = [
            { q: "中國歷史上第一位自稱「皇帝」的君主是誰？", options: ["秦始皇", "漢武帝", "唐太宗", "明太祖"], ans: "秦始皇" },
            { q: "史稱「玄武門之變」的宮廷政變是由哪位皇子發動？", options: ["李建成", "李世民", "李元吉", "李隆基"], ans: "李世民" },
            { q: "明朝初年，廢除丞相制度，集大權於一身的開國皇帝是？", options: ["明惠帝", "明成祖", "明太祖", "明神宗"], ans: "明太祖" },
            { q: "在三國時期，與劉備建立「蜀漢」政權並被尊為武聖的是？", options: ["曹操", "孫權", "關羽", "諸葛亮"], ans: "關羽" }
        ];

        // 🃏 牌庫資料 (替換 img 為您的圖片檔名，如 'card1.jpg')
        const myDeck = [
            { name: "秦始皇", trait: "千古一帝", desc: "滅六國，統一天下。築長城以禦匈奴。", power: 30, img: "https://upload.wikimedia.org/wikipedia/commons/2/27/Qin_Shi_Huangdi.jpg" },
            { name: "漢武帝", trait: "雄才大略", desc: "罷黜百家，獨尊儒術。開闢絲綢之路。", power: 25, img: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Han_Wudi.jpg" },
            { name: "唐太宗", trait: "天可汗", desc: "開創貞觀之治，廣納建言，萬邦來朝。", power: 28, img: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Tang_Taizong.jpg" },
            { name: "明太祖", trait: "驅逐胡虜", desc: "草根皇帝，建立大明。廢除丞相制。", power: 26, img: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Ming_Taizu.jpg" },
            { name: "關羽", trait: "武聖", desc: "過五關斬六將，義薄雲天，威震華夏。", power: 22, img: "https://upload.wikimedia.org/wikipedia/commons/2/27/Guan_Yu_Portrait.jpg" }
        ];

        function showSysMsg(msg) {
            const el = document.getElementById('sysMsg');
            el.innerText = msg; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 3000);
        }

        function createRoom() { playSound('click'); const code = document.getElementById('roomCode').value; if (!code) return; socket.emit('createRoom', code); }
        function joinRoom() { playSound('click'); const code = document.getElementById('roomCode').value; if (!code) return; socket.emit('joinRoom', code); }

        socket.on('roomCreated', (code) => {
            myRoom = code; document.getElementById('statusMsg').innerText = `⛩️ 戰局 [${code}] 已建立，等待對手連線...`;
        });
        socket.on('errorMsg', (msg) => { showSysMsg(`❌ ${msg}`); });

        socket.on('gameStart', () => {
            playSound('click');
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameBoard').classList.remove('hidden');
            showSysMsg("⚔️ 戰局開始！請選擇出戰將領");
            
            // 隨機抽 4 張牌
            myDeck.sort(() => 0.5 - Math.random());
            currentHandCards = myDeck.slice(0, 4);
            renderHand();
        });

        // 渲染手牌
        function renderHand() {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = '';
            currentHandCards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <div class="card-image" style="background-image: url('${card.img || ''}');"><div class="card-name-mask">${card.name}</div></div>
                    <div class="card-trait">「${card.trait}」</div>
                    <div class="card-power">⚔️ 攻擊力 ${card.power}</div>
                `;
                cardEl.onclick = () => openZoomModal(index);
                handDiv.appendChild(cardEl);
            });
        }

        // 打開卡牌檢視器 (PTCG 元素)
        function openZoomModal(index) {
            playSound('zoom');
            selectedHandIndex = index;
            const card = currentHandCards[index];
            const zoomCard = document.getElementById('zoomCardEl');
            zoomCard.innerHTML = `
                <div class="zoom-image" style="background-image: url('${card.img || ''}');"></div>
                <div class="zoom-info">
                    <div class="zoom-name">${card.name}</div>
                    <div class="zoom-trait">特質：${card.trait}</div>
                    <div class="zoom-desc">${card.desc}</div>
                </div>
                <div class="zoom-power">⚔️ 基礎傷害：${card.power}</div>
            `;
            document.getElementById('cardZoomModal').classList.remove('hidden');
        }

        function closeZoomModal() {
            playSound('click');
            document.getElementById('cardZoomModal').classList.add('hidden');
            selectedHandIndex = -1;
        }

        // 確認出戰 (放到 Active Slot)
        function confirmPlayCard() {
            playSound('playCard');
            document.getElementById('cardZoomModal').classList.add('hidden');
            
            const card = currentHandCards[selectedHandIndex];
            const activeField = document.getElementById('myActive');
            
            // 將卡牌置入出戰區
            activeField.innerHTML = `
                <div class="card played">
                    <div class="card-image" style="background-image: url('${card.img || ''}');"><div class="card-name-mask">${card.name}</div></div>
                    <div class="card-power">⚔️ ${card.power}</div>
                </div>
            `;
            activeField.style.border = 'none';
            
            // 顯示攻擊按鈕
            document.getElementById('attackBtn').style.display = 'block';
            pendingDamage = card.power;

            // 廣播給對手
            socket.emit('playCardData', { roomCode: myRoom, card });

            // 移除手牌
            currentHandCards.splice(selectedHandIndex, 1);
            renderHand();
            selectedHandIndex = -1;
            showSysMsg(`【${card.name}】已就緒，隨時可以發動攻擊！`);
        }

        // 接收對手出牌
        socket.on('opponentPlayed', (data) => {
            playSound('playCard');
            const card = data.card;
            const activeField = document.getElementById('opponentActive');
            activeField.innerHTML = `
                <div class="card played" style="border-color: #e74c3c;">
                    <div class="card-image" style="background-image: url('${card.img || ''}');"><div class="card-name-mask" style="color:#e74c3c;">${card.name}</div></div>
                    <div class="card-power" style="background:#8B0000; border-top-color:#e74c3c;">⚔️ ${card.power}</div>
                </div>
            `;
            activeField.style.border = 'none';
            showSysMsg(`敵方指派了【${card.name}】出戰！`);
        });

        // 點擊發動攻擊 -> 觸發歷史問答
        function triggerAttack() {
            playSound('click');
            document.getElementById('attackBtn').style.display = 'none'; // 攻擊後暫時隱藏
            
            const q = questionBank[Math.floor(Math.random() * questionBank.length)];
            document.getElementById('quizQuestion').innerText = q.q;
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            
            const shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.ans);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('quizOverlay').classList.remove('hidden');
        }

        function checkAnswer(selected, correct) {
            const overlay = document.getElementById('quizOverlay');
            if (selected === correct) {
                playSound('click'); // 使用者點擊聲
                showSysMsg("🎯 答對了！歷史之力匯聚，發動攻擊！");
                overlay.classList.add('hidden');
                socket.emit('attackAction', { roomCode: myRoom, damage: pendingDamage, isCorrect: true });
                document.getElementById('myActive').classList.add('shake-effect'); // 自身施放動畫
                setTimeout(() => document.getElementById('myActive').classList.remove('shake-effect'), 400);
            } else {
                playSound('click');
                showSysMsg(`❌ 答錯了！招式被化解... 答案應為：${correct}`);
                overlay.classList.add('hidden');
                socket.emit('attackAction', { roomCode: myRoom, damage: 0, isCorrect: false });
                
                // 答錯後恢復攻擊按鈕，讓玩家下回合可以重試
                setTimeout(() => { document.getElementById('attackBtn').style.display = 'block'; }, 2000);
            }
        }

        function updateHpUI() {
            document.getElementById('myHpBar').style.width = Math.max(0, (myHp / MAX_HP) * 100) + '%';
            document.getElementById('myHpText').innerText = `${myHp} / ${MAX_HP}`;
            document.getElementById('opponentHpBar').style.width = Math.max(0, (opponentHp / MAX_HP) * 100) + '%';
            document.getElementById('opponentHpText').innerText = `${opponentHp} / ${MAX_HP}`;
        }

        socket.on('battleUpdate', (data) => {
            if (data.attacker === socket.id) {
                if(data.isCorrect) {
                    playSound('attack');
                    opponentHp -= data.damage;
                    document.getElementById('opponentArea').classList.add('shake-effect');
                    document.getElementById('opponentActive').classList.add('shake-effect');
                    setTimeout(() => {
                        document.getElementById('opponentArea').classList.remove('shake-effect');
                        document.getElementById('opponentActive').classList.remove('shake-effect');
                    }, 400);
                }
            } else {
                if(data.isCorrect){
                    playSound('attack');
                    myHp -= data.damage;
                    document.getElementById('myArea').classList.add('shake-effect');
                    document.getElementById('myActive').classList.add('shake-effect');
                    setTimeout(() => {
                        document.getElementById('myArea').classList.remove('shake-effect');
                        document.getElementById('myActive').classList.remove('shake-effect');
                    }, 400);
                    showSysMsg(`⚠️ 敵方答對歷史題，發動技能對您造成 ${data.damage} 點傷害！`);
                } else {
                    showSysMsg(`🛡️ 敵方歷史知識不足，攻擊失效！`);
                }
            }
            updateHpUI();
            
            setTimeout(() => {
                if (myHp <= 0) { alert("敗北！您的城池被攻破了..."); location.reload(); } 
                else if (opponentHp <= 0) { alert("勝利！您成功討伐了敵軍！"); location.reload(); }
            }, 800);
        });
    </script>
</body>
</html>
