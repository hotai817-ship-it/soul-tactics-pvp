<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 針對手機端進行最佳化，防止畫面縮放跑版 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英魂決 TCG - 歷史對戰系統</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* 核心重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        body { 
            font-family: "PMingLiU", "MingLiU", "Noto Serif TC", serif; 
            background: radial-gradient(circle at center, #2c3e50 0%, #0a0a0a 100%);
            color: #ecf0f1; text-align: center; overflow: hidden; height: 100vh; width: 100vw;
        }
        .hidden { display: none !important; }

        /* 遊戲大廳 */
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
        h1 { font-size: clamp(40px, 8vw, 60px); color: #D4AF37; text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.5); margin-bottom: 10px; letter-spacing: 2px; }
        h2 { font-size: clamp(16px, 4vw, 24px); color: #bdc3c7; margin-bottom: 30px; }
        .input-group { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 15px; border: 2px solid #D4AF37; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(212,175,55,0.2); }
        input { padding: 12px; font-size: 18px; text-align: center; border: 2px solid #7f8c8d; background: #1a1a1a; color: #D4AF37; border-radius: 8px; margin-bottom: 20px; width: 100%; }
        .btn-container { display: flex; gap: 10px; justify-content: center; }
        .btn-gold { flex: 1; padding: 12px 10px; font-size: 18px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #B8860B, #D4AF37); border: none; color: #000; border-radius: 8px; transition: 0.3s; }
        .btn-red { background: linear-gradient(135deg, #8B0000, #B22222); color: white; }

        /* 戰鬥介面 (手機端優化佈局) */
        #gameBoard { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 10px 5px; }
        
        .player-info { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 15px; background: rgba(0,0,0,0.6); border: 1px solid #7f8c8d; border-radius: 8px; margin: 5px 0; }
        .hp-container { width: 55%; background: #2c3e50; border: 2px solid #222; border-radius: 15px; overflow: hidden; position: relative; height: 20px; }
        .hp-bar { height: 100%; background: linear-gradient(90deg, #ff0000, #ff4d4d); width: 100%; transition: width 0.5s ease-out; }
        .hp-text { position: absolute; width: 100%; text-align: center; top: 1px; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px #000; }
        .player-name { font-size: clamp(16px, 4vw, 20px); color: #D4AF37; font-weight: bold; }

        /* 戰場交鋒區 */
        .battlefield { flex-grow: 1; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 10px 0; }
        .field-slot { width: 26vw; max-width: 120px; height: 38vw; max-height: 175px; border: 2px dashed rgba(212, 175, 55, 0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.3); font-size: 14px; }

        /* 卡牌設計 - 完美適配手機尺寸 */
        .hand { display: flex; justify-content: center; gap: 2vw; height: auto; padding: 5px 0; align-items: flex-end; }
        .card { 
            width: 23vw; max-width: 110px; height: 34vw; max-height: 160px; background: #1a252f;
            border: 2px solid #8c7322; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; 
            transition: all 0.3s; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.8);
            overflow: hidden; flex-shrink: 0;
        }
        .card:active, .card:hover { transform: translateY(-10px); border-color: #D4AF37; box-shadow: 0 5px 15px rgba(212,175,55,0.5); z-index: 10; }
        
        .card-image { width: 100%; height: 55%; background-size: cover; background-position: center; border-bottom: 1px solid #8c7322; position: relative; }
        .card-name-mask { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: #D4AF37; font-size: clamp(12px, 3.5vw, 16px); font-weight: bold; padding: 2px 0; text-shadow: 1px 1px 2px #000; }
        .card-trait { font-size: clamp(10px, 2.5vw, 12px); color: #bdc3c7; margin-top: 2px; font-style: italic; }
        .card-power { position: absolute; bottom: 0; width: 100%; background: linear-gradient(180deg, #8B0000, #4a0000); color: white; font-size: clamp(14px, 4vw, 18px); font-weight: bold; padding: 3px 0; border-top: 1px solid #ff4d4d; }

        .card.played { width: 26vw; max-width: 120px; height: 38vw; max-height: 175px; animation: playAnim 0.4s forwards; cursor: default; }
        .card.hidden-card { background: #111; border-color: #333; }
        
        /* 歷史問答視窗 - 適配小螢幕 */
        #quizOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); padding: 20px; }
        .quiz-box { background: #2c3e50; border: 3px solid #D4AF37; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(212,175,55,0.4); text-align: left; }
        .quiz-box h3 { color: #e74c3c; font-size: 18px; border-bottom: 1px solid #7f8c8d; padding-bottom: 10px; margin-bottom: 15px; }
        #quizQuestion { font-size: clamp(18px, 5vw, 24px); line-height: 1.4; margin-bottom: 20px; }
        .quiz-options { display: grid; grid-template-columns: 1fr; gap: 10px; } /* 手機端改為直排 */
        @media (min-width: 500px) { .quiz-options { grid-template-columns: 1fr 1fr; } } /* 大螢幕變雙排 */
        
        .quiz-btn { background: #34495e; border: 2px solid #7f8c8d; padding: 12px; color: white; font-size: 18px; cursor: pointer; border-radius: 8px; font-family: inherit; }
        .quiz-btn:active, .quiz-btn:hover { background: #D4AF37; color: black; border-color: #D4AF37; }

        @keyframes playAnim { 0% { transform: scale(1.3) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-2deg); } 50% { transform: translateX(10px) rotate(2deg); } 75% { transform: translateX(-10px) rotate(-2deg); } 100% { transform: translateX(0); } }
        .shake-effect { animation: shake 0.4s both; border-color: #ff0000 !important; box-shadow: 0 0 20px red; }
        .correct-effect { box-shadow: 0 0 30px #2ecc71; border-color: #2ecc71 !important; }
        
        #sysMsg { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #f1c40f; padding: 10px 20px; border-radius: 20px; font-size: 16px; z-index: 1000; border: 1px solid #f1c40f; opacity: 0; pointer-events: none; width: max-content; max-width: 90vw; }
    </style>
</head>
<body>
    <div id="sysMsg">系統提示</div>

    <div id="lobby">
        <h1>英魂決</h1>
        <h2>中史科歷史卡牌對戰</h2>
        <div class="input-group">
            <input type="text" id="roomCode" placeholder="輸入對戰房號 (如: 888)" autocomplete="off">
            <div class="btn-container">
                <button class="btn-gold" onclick="createRoom()">創建</button>
                <button class="btn-gold btn-red" onclick="joinRoom()">加入</button>
            </div>
        </div>
        <p id="statusMsg" style="color: #D4AF37; margin-top: 20px; font-size: 16px;"></p>
    </div>

    <div id="gameBoard" class="hidden">
        <!-- 敵方區域 -->
        <div class="player-info" id="opponentArea">
            <div class="player-name">敵軍將領</div>
            <div class="hp-container">
                <div id="opponentHpBar" class="hp-bar"></div>
                <div id="opponentHpText" class="hp-text">100 / 100</div>
            </div>
        </div>
        <div class="hand" id="opponentHand" style="height: 40px; transform: scale(0.6) translateY(-20px);">
            <div class="card hidden-card"></div><div class="card hidden-card"></div><div class="card hidden-card"></div><div class="card hidden-card"></div>
        </div>

        <!-- 戰場區 -->
        <div class="battlefield">
            <div id="opponentField" class="field-slot">敵方出牌</div>
            <div id="myField" class="field-slot">我方出牌</div>
        </div>

        <!-- 我方區域 -->
        <div class="player-info" id="myArea" style="border-color: #D4AF37;">
            <div class="player-name">我軍將領</div>
            <div class="hp-container">
                <div id="myHpBar" class="hp-bar" style="background: linear-gradient(90deg, #2ecc71, #27ae60);"></div>
                <div id="myHpText" class="hp-text">100 / 100</div>
            </div>
        </div>
        <div class="hand" id="myHand"></div>
    </div>

    <!-- 問答視窗 -->
    <div id="quizOverlay" class="hidden">
        <div class="quiz-box" id="quizBox">
            <h3>📜 歷史考驗 (答對發動攻擊)</h3>
            <div id="quizQuestion">題目載入中...</div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'playCard') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'attack') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'correct') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        const socket = io();
        const MAX_HP = 100; 
        let myRoom = '';
        let myHp = MAX_HP;
        let opponentHp = MAX_HP;
        let pendingDamage = 0;
        
        // 卡牌與抽牌系統變數
        let deckPool = [];
        let currentHand = [];

        /* =========================================
           📚 題庫擴充
        ========================================= */
        const questionBank = [
            { q: "中國歷史上第一位自稱「皇帝」的君主是誰？", options: ["秦始皇", "漢武帝", "唐太宗", "明太祖"], ans: "秦始皇" },
            { q: "史稱「玄武門之變」的政變是由哪位皇子發動？", options: ["李建成", "李世民", "李元吉", "李隆基"], ans: "李世民" },
            { q: "明朝初年，廢除丞相制度的開國皇帝是？", options: ["明惠帝", "明成祖", "明太祖", "明神宗"], ans: "明太祖" },
            { q: "漢代開闢「絲綢之路」，派遣張騫出使西域的是？", options: ["漢高祖", "漢文帝", "漢景帝", "漢武帝"], ans: "漢武帝" },
            { q: "在三國時期，與劉備建立「蜀漢」並被尊為武聖的是？", options: ["曹操", "孫權", "關羽", "諸葛亮"], ans: "關羽" },
            { q: "「精忠報國」背刺四字，抗擊金兵的南宋名將是？", options: ["岳飛", "韓世忠", "文天祥", "史可法"], ans: "岳飛" },
            { q: "建立大蒙古國，被尊稱為「成吉思汗」的是？", options: ["忽必烈", "窩闊台", "鐵木真", "拖雷"], ans: "鐵木真" }
        ];

        /* =========================================
           🃏 全新 12 位歷代傳奇人物牌庫
        ========================================= */
        const fullDeck = [
            { name: "秦始皇", trait: "千古一帝", power: 25, img: "https://upload.wikimedia.org/wikipedia/commons/2/27/Qin_Shi_Huangdi.jpg" },
            { name: "項羽", trait: "西楚霸王", power: 30, img: "https://upload.wikimedia.org/wikipedia/commons/7/7f/Xiang_Yu.jpg" },
            { name: "漢武帝", trait: "雄才大略", power: 22, img: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Han_Wudi.jpg" },
            { name: "曹操", trait: "亂世奸雄", power: 24, img: "https://upload.wikimedia.org/wikipedia/commons/4/45/Cao_Cao.jpg" },
            { name: "諸葛亮", trait: "鞠躬盡瘁", power: 20, img: "https://upload.wikimedia.org/wikipedia/commons/4/4b/Zhuge_Liang.jpg" },
            { name: "唐太宗", trait: "天可汗", power: 24, img: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Tang_Taizong.jpg" },
            { name: "武則天", trait: "日月當空", power: 23, img: "https://upload.wikimedia.org/wikipedia/commons/1/1a/Wu_Zetian.jpg" },
            { name: "岳飛", trait: "撼山易撼岳家軍難", power: 28, img: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Yue_Fei.jpg" },
            { name: "成吉思汗", trait: "一代天驕", power: 29, img: "https://upload.wikimedia.org/wikipedia/commons/f/f4/Genghis_Khan.jpg" },
            { name: "明太祖", trait: "驅逐胡虜", power: 26, img: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Ming_Taizu.jpg" },
            { name: "康熙帝", trait: "康乾盛世", power: 21, img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Kangxi_Emperor.jpg" },
            { name: "孫中山", trait: "天下為公", power: 27, img: "https://upload.wikimedia.org/wikipedia/commons/e/ea/Sun_Yat-sen_2.jpg" }
        ];

        function showSysMsg(msg) {
            const el = document.getElementById('sysMsg');
            el.innerText = msg; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 2500);
        }

        function createRoom() {
            playSound('click');
            const code = document.getElementById('roomCode').value;
            if (!code) return showSysMsg("⚠️ 請輸入房號！");
            socket.emit('createRoom', code);
        }

        function joinRoom() {
            playSound('click');
            const code = document.getElementById('roomCode').value;
            if (!code) return showSysMsg("⚠️ 請輸入房號！");
            socket.emit('joinRoom', code);
        }

        socket.on('roomCreated', (code) => {
            myRoom = code;
            document.getElementById('statusMsg').innerText = `⛩️ 房間 [${code}] 已建立，等待將領入陣...`;
        });

        socket.on('errorMsg', (msg) => { showSysMsg(`❌ ${msg}`); });

        socket.on('gameStart', () => {
            playSound('correct');
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameBoard').classList.remove('hidden');
            showSysMsg("⚔️ 戰局開始！");
            updateHpUI();
            
            // 初始化牌庫並抽 4 張牌
            deckPool = [...fullDeck].sort(() => 0.5 - Math.random());
            currentHand = deckPool.splice(0, 4);
            renderHand();
        });

        function renderHand() {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = '';
            currentHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <div class="card-image" style="background-image: url('${card.img}');">
                        <div class="card-name-mask">${card.name}</div>
                    </div>
                    <div class="card-trait">「${card.trait}」</div>
                    <div class="card-power">⚔️ ${card.power}</div>
                `;
                cardEl.onclick = () => {
                    playSound('playCard');
                    playCard(card, index);
                };
                handDiv.appendChild(cardEl);
            });
        }

        function playCard(card, index) {
            const field = document.getElementById('myField');
            field.innerHTML = `
                <div class="card played">
                    <div class="card-image" style="background-image: url('${card.img}');">
                        <div class="card-name-mask">${card.name}</div>
                    </div>
                    <div class="card-power">⚔️ ${card.power}</div>
                </div>`;
            field.style.border = 'none';

            socket.emit('playCardData', { roomCode: myRoom, card });
            pendingDamage = parseInt(card.power, 10);
            
            // 從手中移除並觸發問答
            currentHand.splice(index, 1);
            showQuiz();
        }

        // 抽牌機制 (保持手中隨時有4張牌)
        function replenishHand() {
            if (currentHand.length < 4) {
                if (deckPool.length === 0) {
                    // 牌庫抽乾時，自動重洗所有卡牌
                    deckPool = [...fullDeck].sort(() => 0.5 - Math.random());
                    showSysMsg("🔄 牌庫重洗，英魂再臨！");
                }
                currentHand.push(deckPool.pop());
            }
            renderHand();
        }

        socket.on('opponentPlayed', (data) => {
            playSound('playCard');
            const card = data.card;
            const field = document.getElementById('opponentField');
            field.innerHTML = `
                <div class="card played" style="border-color: #e74c3c;">
                    <div class="card-image" style="background-image: url('${card.img}');">
                        <div class="card-name-mask" style="color:#ffcccc;">${card.name}</div>
                    </div>
                    <div class="card-power" style="background:#8B0000; border-top-color:#e74c3c;">⚔️ ${card.power}</div>
                </div>`;
            field.style.border = 'none';
            showSysMsg(`敵方派出了【${card.name}】！`);
        });

        function showQuiz() {
            const q = questionBank[Math.floor(Math.random() * questionBank.length)];
            document.getElementById('quizQuestion').innerText = q.q;
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            
            const shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.ans);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('quizOverlay').classList.remove('hidden');
        }

        function checkAnswer(selected, correct) {
            const overlay = document.getElementById('quizOverlay');
            const qBox = document.getElementById('quizBox');
            
            const isCorrect = (selected === correct);
            if (isCorrect) {
                playSound('correct');
                qBox.classList.add('correct-effect');
                showSysMsg("🎯 答對了！發動攻擊！");
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('correct-effect');
                    socket.emit('attackAction', { roomCode: myRoom, damage: pendingDamage, isCorrect: true });
                    replenishHand(); // 答完題後自動補牌
                }, 1000);
            } else {
                playSound('wrong');
                qBox.classList.add('shake-effect');
                showSysMsg(`❌ 答錯了！正確解答為：${correct}`);
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('shake-effect');
                    socket.emit('attackAction', { roomCode: myRoom, damage: 0, isCorrect: false });
                    replenishHand(); // 答完題後自動補牌
                }, 1500);
            }
        }

        function updateHpUI() {
            const myPct = Math.max(0, (myHp / MAX_HP) * 100);
            const oppPct = Math.max(0, (opponentHp / MAX_HP) * 100);
            
            document.getElementById('myHpBar').style.width = myPct + '%';
            document.getElementById('myHpText').innerText = `${myHp} / ${MAX_HP}`;
            
            document.getElementById('opponentHpBar').style.width = oppPct + '%';
            document.getElementById('opponentHpText').innerText = `${opponentHp} / ${MAX_HP}`;
        }

        socket.on('battleUpdate', (data) => {
            const dmg = parseInt(data.damage, 10) || 0;

            if (data.attacker === socket.id) {
                if(data.isCorrect && dmg > 0) {
                    opponentHp -= dmg;
                    if (opponentHp < 0) opponentHp = 0; 
                    
                    const oppArea = document.getElementById('opponentArea');
                    oppArea.classList.add('shake-effect');
                    setTimeout(() => oppArea.classList.remove('shake-effect'), 400);
                    playSound('attack');
                }
            } else {
                if(data.isCorrect && dmg > 0){
                    myHp -= dmg;
                    if (myHp < 0) myHp = 0;

                    const myArea = document.getElementById('myArea');
                    myArea.classList.add('shake-effect');
                    setTimeout(() => myArea.classList.remove('shake-effect'), 400);
                    showSysMsg(`⚠️ 敵方答對，對您造成 ${dmg} 點傷害！`);
                    playSound('attack');
                } else {
                    showSysMsg(`🛡️ 敵方答錯了，攻擊失效！`);
                }
            }

            updateHpUI();
            
            setTimeout(() => {
                if (myHp <= 0) {
                    alert("敗北！歷史的巨輪將你輾過...");
                    location.reload();
                } else if (opponentHp <= 0) {
                    alert("勝利！您成功改寫了歷史！");
                    location.reload();
                }
            }, 600);
        });
    </script>
</body>
</html>
