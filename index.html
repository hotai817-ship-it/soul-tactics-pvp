<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《英魂決：時空交錯》房間式即時對戰空間</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --gold: #D4AF37; --bg: #0f172a; --panel: rgba(26, 43, 76, 0.95); }
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; background: var(--bg); color: #f8fafc; margin: 0; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
            /* 防止手機端長按選取文字或彈出選單 */
            -webkit-user-select: none; user-select: none;
        }
        .container { width: 100%; max-width: 1200px; height: 100vh; max-height: 950px; display: flex; flex-direction: column; padding: 10px; }
        h1 { color: var(--gold); font-size: clamp(1.4rem, 2.5vw, 2rem); margin: 5px 0; text-align: center; }
        .btn { background: linear-gradient(#d4af37, #aa771c); color: #111; border: 2px solid #ffe066; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: clamp(0.95rem, 1.5vw, 1.1rem); margin: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); touch-action: manipulation; }
        .input-box { background: #1e293b; border: 2px solid var(--gold); color: white; padding: 12px; border-radius: 6px; font-size: 1.1rem; width: 200px; text-align: center; margin: 8px; outline: none; }
        .hud { background: var(--panel); border: 2px solid var(--gold); padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(0.95rem, 1.5vw, 1.15rem); font-weight: bold; }
        .arena { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 10px; flex-grow: 1; overflow: hidden; border: 1px solid #334155; }
        .zone { display: flex; gap: 12px; justify-content: center; align-items: center; width: 100%; overflow-x: auto; padding: 5px; min-height: 180px; -webkit-overflow-scrolling: touch; }
        .card { 
            background: #FFFDF0; color: #1e293b; border: 3px solid var(--gold); border-radius: 10px; 
            width: clamp(110px, 16vw, 135px); height: clamp(150px, 22vw, 185px); padding: 8px; 
            display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; flex-shrink: 0; box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            /* 優化手機點擊反應，消除點擊藍色陰影與延遲 */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.15s;
        }
        @media (hover: hover) {
            .card:hover { transform: translateY(-5px); }
        }
        .log { background: #000; color: #38bdf8; font-family: monospace; padding: 10px; height: 75px; overflow-y: auto; text-align: left; border-radius: 6px; font-size: clamp(0.8rem, 1.2vw, 0.95rem); border: 1px solid #334155; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .modal-content { background: #1e293b; border: 3px solid var(--gold); padding: 25px; border-radius: 12px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal-btn { background: #3b82f6; color: white; border: none; padding: 14px; margin: 8px 0; border-radius: 8px; width: 100%; cursor: pointer; text-align: left; font-weight: bold; font-size: clamp(0.95rem, 1.5vw, 1.05rem); touch-action: manipulation; }
        .modal-btn:hover { background: #2563eb; }
        .modal-close-btn { background: #ef4444; color: white; border: none; padding: 10px; margin-top: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; touch-action: manipulation; }
        .modal-close-btn:hover { background: #dc2626; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <h1>《英魂決：時空交錯》</h1>
    
    <div id="lobby" style="margin: auto; text-align: center; background: var(--panel); padding: 35px; border: 2px solid var(--gold); border-radius: 15px;">
        <h3 style="color: var(--gold); margin-top:0; font-size: 1.5rem;">輸入房號開始對戰</h3>
        <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 15px;">點選手牌直接部署人物或發動策略，發動攻擊與恢復時接受歷史考驗！</p>
        <input type="text" id="roomInput" class="input-box" placeholder="例如: 8888"><br>
        <button class="btn" onclick="playSound('click'); createRoom();">🏠 建立房間</button>
        <button class="btn" onclick="playSound('click'); joinRoom();">🔑 加入房間</button>
    </div>

    <div id="gameArea" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1; gap: 8px; overflow: hidden;">
        <div class="hud">
            <div>對手 HP: <span id="opHp" style="color:#ef4444;">300</span></div>
            <div id="turnIndicator">回合狀態</div>
            <div>我的 HP: <span id="myHp" style="color:#22c55e;">300</span></div>
        </div>

        <div class="arena">
            <div>
                <div style="color:var(--gold); font-size:0.85em; text-align:left;">對手陣地 (主戰人物與支援區)</div>
                <div class="zone" id="opActive"></div>
            </div>
            <div>
                <div style="color:var(--gold); font-size:0.85em; text-align:left;">我方陣地 (點擊主戰人物答題發動攻擊)</div>
                <div class="zone" id="myActive"></div>
            </div>
        </div>

        <div>
            <div style="color:var(--gold); font-size:0.85em; text-align:left; margin-bottom:3px;">手牌區 (點擊卡牌直接部署或發動策略)</div>
            <div class="zone" id="myHand" style="min-height: 160px; background: rgba(0,0,0,0.3); border-radius: 8px;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <div class="log" id="logBox" style="flex-grow: 1;">[系統] 準備就緒。</div>
        </div>
    </div>
</div>

<!-- 歷史考驗問答互動視窗 -->
<div id="questionModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modalTitle" style="color:var(--gold); margin-top:0;">📜 歷史考驗與戰技激發</h3>
        <p id="qText" style="font-size: clamp(1rem, 1.5vw, 1.15rem); margin: 20px 0; line-height: 1.5;"></p>
        <div id="qOptions"></div>
        <button class="modal-close-btn" onclick="closeModal()">❌ 放棄作答</button>
    </div>
</div>

<script>
    const socket = io();
    let currentRoomId = null;
    let pendingSupportCardName = null;
    let isModalOpen = false;

    // 內建 Web Audio API 音效產生器
    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'deploy') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'attack_success') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        } catch (e) {}
    }

    socket.on('play_sound', (data) => {
        playSound(data.type);
    });

    function createRoom() {
        const roomId = document.getElementById('roomInput').value.trim();
        if (!roomId) { alert("請輸入房間號碼！"); return; }
        socket.emit('create_room', roomId);
    }

    function joinRoom() {
        const roomId = document.getElementById('roomInput').value.trim();
        if (!roomId) { alert("請輸入房間號碼！"); return; }
        socket.emit('join_room', roomId);
    }

    socket.on('room_created', (roomId) => {
        currentRoomId = roomId;
        document.getElementById('lobby').innerHTML = `<h3 style='color:var(--gold);'>🏠 房間 [${roomId}] 建立成功！</h3><p style='color:#38bdf8;'>等待對手加入中...</p>`;
    });

    socket.on('error_msg', (msg) => { 
        alert(msg); 
        isModalOpen = false; 
    });

    socket.on('game_start', ({ roomId }) => {
        currentRoomId = roomId;
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('gameArea').classList.remove('hidden');
        appendLog(`🎉 成功進入房間 [${roomId}]，請點選手牌直接部署人物或發動策略！`);
    });

    socket.on('game_state_update', ({ myState, opState, isMyTurn }) => {
        document.getElementById('myHp').innerText = myState.hp;
        document.getElementById('opHp').innerText = opState.hp;

        const indicator = document.getElementById('turnIndicator');
        if (isMyTurn) {
            let actionText = myState.hasPlayedCard ? "⭐ 已出牌，請點擊英雄答題攻擊" : "⭐ 請點選手牌出牌，或點擊英雄進攻";
            indicator.innerText = actionText;
            indicator.style.color = "#4ade80";
        } else {
            indicator.innerText = "⏳ 對手回合中...";
            indicator.style.color = "#f87171";
        }

        // 渲染手牌：使用 onpointerdown 取代 onclick，完美解決手機點擊無反應與雙擊延遲
        const handDiv = document.getElementById('myHand');
        handDiv.innerHTML = "";
        myState.hand.forEach((card, idx) => {
            let tagColor = card.type === '人物' ? '#78350f' : '#1e3a8a';
            let canPlay = isMyTurn && !myState.hasPlayedCard;
            let opacity = canPlay ? '1' : '0.5';
            
            handDiv.innerHTML += `
                <div class="card" style="opacity: ${opacity};" onpointerdown="playCard(${idx}, ${canPlay})">
                    <div style="font-size:0.75em; font-weight:bold; color:${tagColor};">[${card.dynasty}] ${card.type}</div>
                    <div style="font-size:0.95em; font-weight:bold; color:#78350f; text-align:center;">${card.name}</div>
                    <div style="font-size:0.65em; color:#475569; overflow:hidden; max-height:45px;">${card.skill}: ${card.desc}</div>
                    <div style="font-size:0.7em; background:#fef3c7; font-weight:bold; color:#b45309; text-align:center;">${canPlay ? '點擊直接出牌' : '等待中'}</div>
                </div>`;
        });

        // 渲染我方主戰人物與支援區
        const myActive = document.getElementById('myActive');
        let supportHtml = myState.supportArea.map(c => `<span style="font-size:0.75rem; background:#1e3a8a; color:white; padding:4px 8px; border-radius:4px; margin-right:4px;">🛡️ ${c.name}</span>`).join('');
        
        if (myState.active) {
            let canAttack = isMyTurn;
            let activeOpacity = canAttack ? '1' : '0.6';
            myActive.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:5px; width:100%;">
                    <div style="display:flex; gap:10px; align-items:center;">
                        <div class="card" style="border:3px solid #22c55e; opacity: ${activeOpacity};" onpointerdown="triggerAttack(${isMyTurn})">
                            <div style="font-size:0.75em; font-weight:bold; color:#78350f;">[${myState.active.dynasty}] 主戰人物</div>
                            <div style="font-size:0.95em; font-weight:bold; color:#78350f; text-align:center;">${myState.active.name}</div>
                            <div style="font-size:0.65em; color:#475569;">${myState.active.skill}</div>
                            <div style="font-size:0.7em; background:#dcfce7; color:#15803d; font-weight:bold; text-align:center;">${canAttack ? '⚔️ 點擊答題攻擊' : '等待回合'}</div>
                        </div>
                    </div>
                    ${supportHtml ? `<div style="font-size:0.85rem; color:#38bdf8;">支援區: ${supportHtml}</div>` : ''}
                </div>`;
        } else {
            myActive.innerHTML = `<div style="color:#64748b; font-size:0.95rem;">請從手牌點擊歷史人物卡部署到戰陣上 ${supportHtml ? '<br>支援區: ' + supportHtml : ''}</div>`;
        }

        // 渲染對手陣地
        const opActive = document.getElementById('opActive');
        let opSupportHtml = opState.supportArea.map(c => `<span style="font-size:0.75rem; background:#1e3a8a; color:white; padding:4px 8px; border-radius:4px;">🛡️ ${c.name}</span>`).join('');
        if (opState.active) {
            opActive.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                    <div class="card" style="border:3px solid #ef4444;">
                        <div style="font-size:0.75em; font-weight:bold; color:#78350f;">[${opState.active.dynasty}] 對手主戰</div>
                        <div style="font-size:0.95em; font-weight:bold; color:#78350f; text-align:center;">${opState.active.name}</div>
                        <div style="font-size:0.65em; color:#475569;">${opState.active.skill}</div>
                        <div style="font-size:0.7em; background:#fee2e2; color:#991b1b; font-weight:bold; text-align:center;">部署中</div>
                    </div>
                    ${opSupportHtml ? `<div style="font-size:0.85rem; color:#38bdf8;">支援區: ${opSupportHtml}</div>` : ''}
                </div>`;
        } else {
            opActive.innerHTML = `<div style="color:#64748b; font-size:0.95rem;">對手尚未部署歷史人物</div>`;
        }
    });

    // 出牌函數
    function playCard(cardIndex, canPlay) {
        if (!canPlay || isModalOpen) return;
        playSound('click');
        socket.emit('play_card', { roomId: currentRoomId, cardIndex });
    }

    socket.on('show_support_question', ({ qData, cardName }) => {
        isModalOpen = true;
        pendingSupportCardName = cardName;
        document.getElementById('modalTitle').innerText = `📜 策略考驗 - 【${cardName}】`;
        document.getElementById('qText').innerText = qData.q;
        const optDiv = document.getElementById('qOptions');
        optDiv.innerHTML = "";
        qData.opts.forEach((opt, idx) => {
            let isCorrect = (idx === qData.correctIndex);
            optDiv.innerHTML += `<button class="modal-btn" onpointerdown="submitSupportAnswer(${isCorrect})">${opt}</button>`;
        });
        document.getElementById('questionModal').classList.remove('hidden');
    });

    function submitSupportAnswer(isCorrect) {
        document.getElementById('questionModal').classList.add('hidden');
        isModalOpen = false;
        socket.emit('resolve_support_card', { roomId: currentRoomId, cardName: pendingSupportCardName, answerCorrect: isCorrect });
        pendingSupportCardName = null;
    }

    function triggerAttack(isMyTurn) {
        if (!isMyTurn || isModalOpen) return;
        playSound('click');
        isModalOpen = true;
        socket.emit('get_attack_question', { roomId: currentRoomId });
    }

    socket.on('show_attack_question', ({ qData }) => {
        isModalOpen = true;
        document.getElementById('modalTitle').innerText = "⚔️ 主戰人物戰技激發";
        document.getElementById('qText').innerText = qData.q;
        const optDiv = document.getElementById('qOptions');
        optDiv.innerHTML = "";
        qData.opts.forEach((opt, idx) => {
            let isCorrect = (idx === qData.correctIndex);
            optDiv.innerHTML += `<button class="modal-btn" onpointerdown="submitAttackAnswer(${isCorrect})">${opt}</button>`;
        });
        document.getElementById('questionModal').classList.remove('hidden');
    });

    function submitAttackAnswer(isCorrect) {
        document.getElementById('questionModal').classList.add('hidden');
        isModalOpen = false;
        socket.emit('attack', { roomId: currentRoomId, answerCorrect: isCorrect });
    }

    function closeModal() {
        document.getElementById('questionModal').classList.add('hidden');
        isModalOpen = false;
        pendingSupportCardName = null;
    }

    socket.on('battle_log', (data) => { appendLog(data.msg); });
    socket.on('game_over', ({ winner }) => {
        if (winner === socket.id) {
            alert("🎉 恭喜您在《英魂決：時空交錯》中獲得勝利！");
        } else {
            alert("❌ 勝敗乃兵家常事，穿越時空者請重新來過！");
        }
        location.reload();
    });

    function appendLog(text) {
        const box = document.getElementById('logBox');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
