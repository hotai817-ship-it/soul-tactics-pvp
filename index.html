<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《九九幻獸島》即時對戰</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --primary: #3b82f6; --bg: #f0fdfa; --text: #0f172a; --card-bg: #ffffff; }
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'PingFang TC', sans-serif; }
        body { 
            background: var(--bg); color: var(--text); margin: 0; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            -webkit-user-select: none; user-select: none; overflow: hidden;
        }
        .container { width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        h1 { color: #0284c7; text-align: center; margin: 5px 0; font-size: clamp(1.5rem, 3vw, 2.2rem); text-shadow: 2px 2px 0px #bae6fd; }
        
        .btn { background: #f59e0b; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; font-size: 1.1rem; margin: 5px; box-shadow: 0 4px 0 #b45309; transition: transform 0.1s; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn:disabled { background: #94a3b8; box-shadow: 0 4px 0 #64748b; cursor: not-allowed; }
        
        .input-box { border: 2px solid #0284c7; padding: 12px; border-radius: 12px; font-size: 1.1rem; width: 200px; text-align: center; outline: none; }
        
        .hud { background: #e0f2fe; border: 3px solid #7dd3fc; padding: 10px 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;}
        
        .arena { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-around; background: #cffafe; border-radius: 15px; padding: 10px; border: 3px dashed #38bdf8; }
        .zone { display: flex; gap: 10px; justify-content: center; align-items: center; overflow-x: auto; min-height: 140px; }
        
        /* 幻獸卡牌樣式 */
        .monster-card {
            background: #fef08a; border: 4px solid #eab308; border-radius: 12px; width: 100px; height: 130px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; position: relative;
        }
        .monster-card.selected { border-color: #ef4444; box-shadow: 0 0 15px #ef4444; transform: scale(1.1); }
        .monster-hp { font-size: 2.2rem; font-weight: 900; color: #b91c1c; }
        .monster-pts { position: absolute; top: -10px; right: -10px; background: #3b82f6; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; border: 2px solid white; }
        
        /* 數字手牌樣式 */
        .number-card {
            background: white; border: 3px solid #94a3b8; border-radius: 12px; width: 70px; height: 100px;
            display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; color: #1e293b;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .number-card.selected { border-color: #22c55e; background: #dcfce7; color: #15803d; transform: translateY(-10px); }
        
        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
        
        .log { background: white; color: #334155; padding: 10px; height: 80px; overflow-y: auto; text-align: left; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 0.95rem; margin-top: 10px;}
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌟《九九幻獸島》🌟</h1>
    
    <!-- 大廳 -->
    <div id="lobby" style="margin: auto; text-align: center; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <h3 style="color: var(--primary); margin-top:0;">尋找因數的對決！</h3>
        <p>找出兩張手牌相乘等於幻獸 HP，將其擊敗！</p>
        <input type="text" id="roomInput" class="input-box" placeholder="輸入房號 (例: 99)"><br><br>
        <button class="btn" onclick="playSound('click'); createRoom();">開創島嶼 (建立房間)</button>
        <button class="btn" style="background:#3b82f6; box-shadow:0 4px 0 #1d4ed8;" onclick="playSound('click'); joinRoom();">登陸島嶼 (加入房間)</button>
    </div>

    <!-- 遊戲區 -->
    <div id="gameArea" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
        <div class="hud">
            <div>對手分數: <span id="opScore" style="color:#ef4444; font-size:1.3rem;">0</span></div>
            <div id="turnIndicator" style="color:#f59e0b; font-size:1.3rem;">回合狀態</div>
            <div>我的分數: <span id="myScore" style="color:#22c55e; font-size:1.3rem;">0</span></div>
        </div>

        <div class="arena">
            <!-- 幻獸區 -->
            <div>
                <div style="text-align:center; font-weight:bold; margin-bottom:5px; color:#0369a1;">野生幻獸區 (點擊鎖定目標) - 剩餘: <span id="deckCount">0</span> 隻</div>
                <div class="zone" id="fieldArea"></div>
            </div>
            
            <!-- 手牌區 -->
            <div>
                <div style="text-align:center; font-weight:bold; margin-bottom:5px; color:#166534;">你的數字卡 (請選擇 2 張)</div>
                <div class="zone" id="handArea"></div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn" id="btnAttack" onclick="executeAttack()" style="background:#ef4444; box-shadow:0 4px 0 #b91c1c;">⚔️ 發動討伐！</button>
            <button class="btn" id="btnDiscard" onclick="executeDiscard()" style="background:#8b5cf6; box-shadow:0 4px 0 #6d28d9;">♻️ 棄牌重抽</button>
        </div>

        <div class="log" id="logBox">歡迎來到九九幻獸島！最先獲得 100 分的人獲勝！</div>
    </div>
</div>

<script>
    const socket = io();
    let currentRoomId = null;
    
    // UI 狀態選擇
    let selectedHandIndices = [];
    let selectedMonsterIndex = null;
    let isMyTurnCurrent = false;

    // Web Audio API 單例防呆
    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'draw') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else { // click
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        } catch (e) { console.error(e); }
    }

    socket.on('play_sound', (data) => playSound(data.type));

    function createRoom() {
        const roomId = document.getElementById('roomInput').value.trim();
        if (!roomId) { alert("請輸入房號！"); return; }
        socket.emit('create_room', roomId);
    }

    function joinRoom() {
        const roomId = document.getElementById('roomInput').value.trim();
        if (!roomId) { alert("請輸入房號！"); return; }
        socket.emit('join_room', roomId);
    }

    socket.on('room_created', (roomId) => {
        currentRoomId = roomId;
        document.getElementById('lobby').innerHTML = `<h3 style='color:#3b82f6;'>🏠 房間 [${roomId}] 已建立！</h3><p>等待另一位幻獸大師加入...</p>`;
    });

    socket.on('error_msg', (msg) => alert(msg));

    socket.on('game_start', ({ roomId }) => {
        currentRoomId = roomId;
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('gameArea').classList.remove('hidden');
        appendLog(`🎉 成功登陸島嶼！目標：100分！`);
    });

    socket.on('game_state_update', ({ myState, opState, fieldMonsters, monstersLeft, isMyTurn }) => {
        isMyTurnCurrent = isMyTurn;
        document.getElementById('myScore').innerText = myState.score;
        document.getElementById('opScore').innerText = opState.score;
        document.getElementById('deckCount').innerText = monstersLeft;

        const indicator = document.getElementById('turnIndicator');
        if (isMyTurn) {
            indicator.innerText = "⭐ 你的回合";
            indicator.style.color = "#16a34a";
        } else {
            indicator.innerText = "⏳ 對手思考中...";
            indicator.style.color = "#ef4444";
        }

        // 清空選擇狀態
        selectedHandIndices = [];
        selectedMonsterIndex = null;
        updateActionButtons();

        // 渲染幻獸區
        const fieldArea = document.getElementById('fieldArea');
        fieldArea.innerHTML = "";
        fieldMonsters.forEach((monster, idx) => {
            fieldArea.innerHTML += `
                <div class="monster-card" id="monster-${idx}" onclick="toggleMonster(${idx})">
                    <div class="monster-pts">${monster.pts}</div>
                    <div style="font-size: 2rem;">${monster.emoji}</div>
                    <div class="monster-hp">${monster.hp}</div>
                    <div style="font-size: 0.8rem; font-weight:bold;">${monster.name}</div>
                </div>`;
        });

        // 渲染手牌區
        const handArea = document.getElementById('handArea');
        handArea.innerHTML = "";
        myState.hand.forEach((num, idx) => {
            handArea.innerHTML += `
                <div class="number-card" id="card-${idx}" onclick="toggleCard(${idx})">
                    ${num}
                </div>`;
        });
    });

    function toggleMonster(idx) {
        if (!isMyTurnCurrent) return;
        playSound('click');
        if (selectedMonsterIndex === idx) {
            selectedMonsterIndex = null;
            document.getElementById(`monster-${idx}`).classList.remove('selected');
        } else {
            if (selectedMonsterIndex !== null) {
                document.getElementById(`monster-${selectedMonsterIndex}`).classList.remove('selected');
            }
            selectedMonsterIndex = idx;
            document.getElementById(`monster-${idx}`).classList.add('selected');
        }
        updateActionButtons();
    }

    function toggleCard(idx) {
        if (!isMyTurnCurrent) return;
        playSound('click');
        const cardEl = document.getElementById(`card-${idx}`);
        
        if (selectedHandIndices.includes(idx)) {
            // 取消選擇
            selectedHandIndices = selectedHandIndices.filter(i => i !== idx);
            cardEl.classList.remove('selected');
        } else {
            // 選擇 (最多2張)
            if (selectedHandIndices.length >= 2) {
                let firstIdx = selectedHandIndices.shift();
                document.getElementById(`card-${firstIdx}`).classList.remove('selected');
            }
            selectedHandIndices.push(idx);
            cardEl.classList.add('selected');
        }
        updateActionButtons();
    }

    function updateActionButtons() {
        const btnAttack = document.getElementById('btnAttack');
        const btnDiscard = document.getElementById('btnDiscard');
        
        if (selectedHandIndices.length === 2 && selectedMonsterIndex !== null) {
            btnAttack.disabled = false;
        } else {
            btnAttack.disabled = true;
        }

        if (selectedHandIndices.length === 1 && selectedMonsterIndex === null) {
            btnDiscard.disabled = false;
            btnDiscard.innerText = "♻️ 棄牌重抽 (結束回合)";
        } else {
            btnDiscard.disabled = true;
            btnDiscard.innerText = "♻️ 棄牌重抽 (需只選1張卡)";
        }
    }

    function executeAttack() {
        if (selectedHandIndices.length !== 2 || selectedMonsterIndex === null) return;
        playSound('click');
        socket.emit('attack', { roomId: currentRoomId, cardIndices: selectedHandIndices, monsterIndex: selectedMonsterIndex });
    }

    function executeDiscard() {
        if (selectedHandIndices.length !== 1) return;
        playSound('click');
        socket.emit('discard', { roomId: currentRoomId, cardIndex: selectedHandIndices[0] });
    }

    socket.on('battle_log', (data) => { appendLog(data.msg); });
    socket.on('game_over', ({ msg, winner }) => {
        if (winner) {
            if (winner === socket.id) alert("🏆 恭喜你達到目標，成為首席幻獸大師！\n" + msg);
            else alert("😢 對手先達到目標了，請再接再厲！\n" + msg);
        } else {
            alert("ℹ️ 遊戲結束：\n" + msg);
        }
        location.reload();
    });

    function appendLog(text) {
        const box = document.getElementById('logBox');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
