<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亞特蘭提斯：六維度密室 (精英數學特訓)</title>
    <!-- 引入 Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #001f3f; --panel-bg: rgba(0, 45, 90, 0.85); --primary: #00e5ff;
            --accent: #ffaa00; --danger: #ff3366; --success: #00ff88; --text: #e0f7fa;
        }
        * { box-sizing: border-box; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text);
            background-image: radial-gradient(circle at center, #003366 0%, #001122 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }
        .container {
            width: 100%; max-width: 800px; background: var(--panel-bg);
            border: 2px solid var(--primary); border-radius: 15px; padding: 30px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2); text-align: center; position: relative;
        }
        h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary); margin-top: 0; font-size: 2.2rem;}
        h2 { color: var(--accent); margin-bottom: 10px; }
        
        .login-box { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; border: 1px solid var(--primary); margin-bottom: 20px; }
        
        .hud {
            display: flex; justify-content: space-between; margin-bottom: 20px;
            padding: 10px 20px; background: rgba(0,0,0,0.5); border-radius: 10px;
            border: 1px solid var(--primary); font-size: 1.2rem; font-weight: bold;
        }
        .timer { color: var(--danger); text-shadow: 0 0 5px var(--danger); font-family: monospace; font-size: 1.5rem;}
        
        .story-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; color: #b2ebf2; }
        .question-box { background: rgba(0, 0, 0, 0.6); padding: 20px; border-radius: 10px; border-left: 5px solid var(--accent); font-size: 1.3rem; margin-bottom: 25px; text-align: left; }
        
        .input-group { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        input[type="number"], input[type="text"] {
            padding: 12px; font-size: 1.2rem; width: 150px; text-align: center;
            border: 2px solid var(--primary); border-radius: 8px; background: #001122; color: var(--primary);
            outline: none; font-weight: bold;
        }
        input:focus { box-shadow: 0 0 15px var(--primary); }
        
        .btn {
            background: linear-gradient(135deg, #0088cc, #005599); border: 2px solid var(--primary);
            color: white; padding: 12px 25px; font-size: 1.2rem; border-radius: 8px;
            cursor: pointer; font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background: linear-gradient(135deg, #00aaff, #0077cc); transform: translateY(-2px); box-shadow: 0 0 15px var(--primary); }
        .btn:disabled { background: #555; border-color: #777; cursor: not-allowed; box-shadow: none; transform: none; color: #aaa;}
        
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .opt-btn { background: #002244; border: 2px solid #0088cc; padding: 15px; font-size: 1.5rem; border-radius: 10px; color: white; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { background: #004488; border-color: var(--primary); }
        
        .hidden { display: none !important; }
        .feedback { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: bold; pointer-events: none; opacity: 0; z-index: 10; text-shadow: 0 0 20px black; }
        
        @keyframes flashCorrect { 0% { opacity:1; color: var(--success); transform: translate(-50%, -50%) scale(0.5); } 50% { opacity:1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity:0; transform: translate(-50%, -50%) scale(1.5); } }
        @keyframes flashWrong { 0% { opacity:1; color: var(--danger); transform: translate(-50%, -50%) rotate(-10deg); } 20% { transform: translate(-50%, -50%) rotate(10deg); } 40% { transform: translate(-50%, -50%) rotate(-10deg); } 100% { opacity:0; } }
        .anim-correct { animation: flashCorrect 1s forwards; }
        .anim-wrong { animation: flashWrong 0.8s forwards; }
    </style>
</head>
<body>

<div class="feedback" id="feedbackMsg"></div>

<!-- 首頁與登入 -->
<div class="container" id="screenStart">
    <h1>🔱 亞特蘭提斯：六維度密室</h1>
    <h2>精英小學六年級 數學極限特訓</h2>
    
    <div class="login-box">
        <div style="margin-bottom:15px; color:var(--accent);">請輸入班別與學號啟動潛水艙</div>
        <div class="input-group" style="margin-top:0;">
            <input type="text" id="classInput" placeholder="班別 (例:6A)" oninput="verifyStudent()">
            <input type="text" id="noInput" placeholder="學號 (例:01)" oninput="verifyStudent()">
        </div>
        <div id="studentNameDisplay" style="color:var(--danger); font-weight:bold; height:24px;">身分尚未驗證</div>
    </div>

    <button class="btn" id="startBtn" onclick="startGame()" disabled>▶ 啟動潛水艙 (開始遊戲)</button>
    <br><br>
    <a href="/dashboard" target="_blank" class="btn" style="background:#059669; border-color:#10b981; font-size:1rem; text-decoration:none; display:inline-block;">📊 查看排行榜</a>
</div>

<!-- 遊戲區 -->
<div class="container hidden" id="screenGame">
    <div class="hud">
        <div id="levelIndicator">維度層: 1 / 4</div>
        <div>探險家: <span id="playerNameHUD" style="color:var(--accent);"></span></div>
        <div class="timer">⏳ <span id="timeDisplay">10:00</span></div>
    </div>
    <h2 id="levelTitle">關卡名稱</h2>
    <p class="story-text" id="levelStory">關卡劇情描述</p>
    <div class="question-box" id="questionText">問題會顯示在這裡</div>
    <div id="answerArea"></div>
</div>

<!-- 結算畫面 -->
<div class="container hidden" id="screenEnd">
    <h1 id="endTitle">遊戲結束</h1>
    <p class="story-text" id="endDesc"></p>
    <button class="btn" onclick="location.reload()">🔄 回到首頁</button>
</div>

<script>
    const socket = io();
    let currentIdentity = null;
    let currentLevel = 0;
    let timeRemaining = 600; // 10分鐘
    let timerInterval = null;
    let currentAnswer = null;

    // --- 學生驗證機制 ---
    function verifyStudent() {
        const cls = document.getElementById('classInput').value.trim().toUpperCase();
        const num = document.getElementById('noInput').value.trim();
        if (cls && num) {
            socket.emit('verify_student', { className: cls, studentNo: num });
        } else {
            document.getElementById('studentNameDisplay').style.color = 'var(--danger)';
            document.getElementById('studentNameDisplay').innerText = "身分尚未驗證";
            document.getElementById('startBtn').disabled = true;
            currentIdentity = null;
        }
    }

    socket.on('student_verified', ({ name }) => {
        const cls = document.getElementById('classInput').value.trim().toUpperCase();
        const num = document.getElementById('noInput').value.trim();
        currentIdentity = { className: cls, studentNo: num, name: name };
        document.getElementById('studentNameDisplay').style.color = 'var(--success)';
        document.getElementById('studentNameDisplay').innerText = `✅ 驗證成功：歡迎 ${name} 探險家！`;
        document.getElementById('startBtn').disabled = false;
    });

    socket.on('student_not_found', () => {
        document.getElementById('studentNameDisplay').style.color = 'var(--danger)';
        document.getElementById('studentNameDisplay').innerText = `❌ 查無此學生資料`;
        document.getElementById('startBtn').disabled = true;
        currentIdentity = null;
    });

    // --- 音效引擎 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'victory') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
        }
    }

    function showFeedback(isCorrect) {
        const fb = document.getElementById('feedbackMsg');
        fb.classList.remove('anim-correct', 'anim-wrong');
        void fb.offsetWidth; 
        if (isCorrect) {
            fb.innerText = "⭕ 正確！"; fb.classList.add('anim-correct'); playSound('correct');
        } else {
            fb.innerText = "❌ 錯誤！-15秒"; fb.classList.add('anim-wrong'); playSound('wrong');
            timeRemaining = Math.max(0, timeRemaining - 15);
            updateTimerDisplay();
        }
    }

    // --- 關卡生成 ---
    function generateLevel1() {
        const sets = [
            { target: "37.5%", ans: "3/8", wrong: ["0.375%", "3.75", "1/3"] },
            { target: "0.625", ans: "5/8", wrong: ["6.25%", "3/5", "62.5"] },
            { target: "80%", ans: "4/5", wrong: ["0.08", "8/100", "4/50"] }
        ];
        const q = sets[Math.floor(Math.random() * sets.length)];
        let options = [q.ans, ...q.wrong].sort(() => Math.random() - 0.5);
        
        document.getElementById('levelTitle').innerText = "第一關：真理天平";
        document.getElementById('levelStory').innerHTML = "天平的左側放著刻有 <b style='color:#00ff88;font-size:1.5rem;'> " + q.target + " </b> 的砝碼。";
        document.getElementById('questionText').innerText = "請選擇與其值完全相等的選項：";
        
        let html = `<div class="options-grid">`;
        options.forEach(opt => { html += `<button class="opt-btn" onclick="checkMultipleChoice('${opt}', '${q.ans}')">${opt}</button>`; });
        html += `</div>`;
        document.getElementById('answerArea').innerHTML = html;
    }

    function generateLevel2() {
        const area = [200, 300, 400][Math.floor(Math.random() * 3)];
        const initH = [10, 15, 20][Math.floor(Math.random() * 3)];
        const diff = Math.floor(Math.random() * 5) + 3;
        const targetH = initH + diff;
        currentAnswer = area * diff;

        document.getElementById('levelTitle').innerText = "第二關：阿基米德的密室";
        document.getElementById('levelStory').innerHTML = `長方體玻璃缸底面積為 <b>${area} cm²</b>，目前水深 <b>${initH} cm</b>。過關鑰匙卡在缸壁高 <b>${targetH} cm</b> 的孔洞中。`;
        document.getElementById('questionText').innerHTML = "你需要投入總體積多少 <b>cm³</b> 的鐵塊，才能讓水位剛好上升到孔洞？";
        
        document.getElementById('answerArea').innerHTML = `
            <div class="input-group">
                <input type="number" id="numInput" placeholder="體積 (cm³)">
                <button class="btn" onclick="checkInputAnswer()">解開機關</button>
            </div>
        `;
    }

    function generateLevel3() {
        const price = [800, 1200, 1500][Math.floor(Math.random() * 3)];
        const d1 = [80, 90][Math.floor(Math.random() * 2)];
        const d2 = [80, 90][Math.floor(Math.random() * 2)];
        currentAnswer = price * (d1 / 100) * (d2 / 100);

        document.getElementById('levelTitle').innerText = "第三關：貪婪商會";
        document.getElementById('levelStory').innerHTML = `深海潛水服定價 <b>$${price}</b>。商人說：「今天全店大減價 <b>${d1}折</b>，憑公會卡結帳金額再打 <b>${d2}折</b>！」`;
        document.getElementById('questionText').innerHTML = "請計算最終實際需要支付的售價是多少？";
        
        document.getElementById('answerArea').innerHTML = `
            <div class="input-group"><span style="font-size:1.5rem; line-height:50px;">$</span>
                <input type="number" id="numInput" placeholder="輸入售價"><button class="btn" onclick="checkInputAnswer()">支付金幣</button>
            </div>
        `;
    }

    function generateLevel4() {
        const area = 250; 
        const initL = 2; // 2000 cm3
        const leakFracStr = "3/5"; const leakL = 0.6; // 600 cm3
        const stoneV = 500; // cm3
        currentAnswer = 7.6; // (2000 - 600 + 500) / 250 = 7.6

        document.getElementById('levelTitle').innerText = "終極關卡：六神機甲 (Boss戰)";
        document.getElementById('levelStory').innerHTML = `機甲護盾水箱底面積 <b>${area} cm²</b>，原裝 <b>${initL} L</b> 水。漏失 <b>${leakFracStr} L</b> 後洞口癒合。機甲又投入體積 <b>${stoneV} cm³</b> 的核心礦石！`;
        document.getElementById('questionText').innerHTML = "現在護盾水箱裡的水位高度是多少 <b>cm</b>？（請輸入小數）";
        
        document.getElementById('answerArea').innerHTML = `
            <div class="input-group">
                <input type="number" step="0.1" id="numInput" placeholder="高度 (cm)">
                <button class="btn" onclick="checkInputAnswer()" style="background:#ff3366; border-color:#fff;">🗡️ 擊破護盾！</button>
            </div>
        `;
    }

    const levels = [generateLevel1, generateLevel2, generateLevel3, generateLevel4];

    function startGame() {
        if (!currentIdentity) return;
        document.getElementById('screenStart').classList.add('hidden');
        document.getElementById('screenGame').classList.remove('hidden');
        document.getElementById('playerNameHUD').innerText = currentIdentity.name;
        
        currentLevel = 0; timeRemaining = 600;
        
        timerInterval = setInterval(() => {
            timeRemaining--; updateTimerDisplay();
            if (timeRemaining <= 0) gameOver(false, "潛水艙氧氣耗盡，挑戰失敗。");
        }, 1000);
        
        loadLevel();
    }

    function updateTimerDisplay() {
        let m = Math.floor(timeRemaining / 60); let s = timeRemaining % 60;
        document.getElementById('timeDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function loadLevel() {
        document.getElementById('levelIndicator').innerText = `維度層: ${currentLevel + 1} / ${levels.length}`;
        levels[currentLevel](); 
    }

    function checkMultipleChoice(selected, correct) {
        if (selected === correct) { showFeedback(true); nextLevel(); } 
        else showFeedback(false);
    }

    function checkInputAnswer() {
        const inputVal = parseFloat(document.getElementById('numInput').value);
        if (isNaN(inputVal)) return;
        if (Math.abs(inputVal - currentAnswer) < 0.01) { showFeedback(true); nextLevel(); } 
        else showFeedback(false);
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel >= levels.length) {
            gameOver(true, `太神了！你完美運用了六年級數學，成功逃離亞特蘭提斯！<br><br>你的成績已上傳至排行榜。<br>最佳剩餘時間：<span style="color:var(--success); font-size:1.5rem; font-weight:bold;">${document.getElementById('timeDisplay').innerText}</span>`);
        } else { setTimeout(loadLevel, 1000); }
    }

    function gameOver(isWin, desc) {
        clearInterval(timerInterval);
        document.getElementById('screenGame').classList.add('hidden');
        document.getElementById('screenEnd').classList.remove('hidden');
        
        const endTitle = document.getElementById('endTitle');
        if (isWin) {
            playSound('victory');
            endTitle.innerText = "🎉 挑戰成功！精算大師 🎉";
            endTitle.style.color = "var(--success)";
            endTitle.style.textShadow = "0 0 15px var(--success)";
            
            // 將成績傳送給後端儲存
            socket.emit('submit_record', { identity: currentIdentity, timeRemaining: timeRemaining });
        } else {
            endTitle.innerText = "💀 挑戰失敗";
            endTitle.style.color = "var(--danger)";
            endTitle.style.textShadow = "0 0 15px var(--danger)";
        }
        document.getElementById('endDesc').innerHTML = desc;
    }
</script>
</body>
</html>
