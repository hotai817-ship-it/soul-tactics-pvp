<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英魂決 TCG - 中史科校本對戰系統 (官方完全版)</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        body { 
            font-family: "PMingLiU", "MingLiU", "Noto Serif TC", serif; 
            background: radial-gradient(circle at center, #1a252f 0%, #000000 100%);
            color: #ecf0f1; text-align: center; overflow: hidden; height: 100vh; width: 100vw;
        }
        .hidden { display: none !important; }

        /* --- 遊戲大廳 --- */
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
        h1 { font-size: clamp(36px, 7vw, 55px); color: #D4AF37; text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.8); margin-bottom: 5px; letter-spacing: 2px; }
        h2 { font-size: clamp(14px, 3.5vw, 20px); color: #bdc3c7; margin-bottom: 25px; letter-spacing: 3px; }
        .input-group { background: rgba(0,0,0,0.8); padding: 25px; border-radius: 15px; border: 2px solid #D4AF37; width: 100%; max-width: 400px; box-shadow: 0 0 25px rgba(212,175,55,0.3); }
        input { padding: 12px; font-size: 18px; text-align: center; border: 2px solid #7f8c8d; background: #111; color: #D4AF37; border-radius: 8px; margin-bottom: 15px; width: 100%; font-family: inherit; font-weight: bold; }
        .btn-container { display: flex; gap: 12px; justify-content: center; }
        .btn-gold { flex: 1; padding: 12px 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #B8860B, #D4AF37); border: none; color: #000; border-radius: 8px; transition: 0.3s; }
        .btn-red { background: linear-gradient(135deg, #8B0000, #B22222); color: white; }

        /* --- 戰鬥介面 (RWD 三戰區) --- */
        #gameBoard { display: flex; flex-direction: column; justify-content: space-between; height: 100vh; padding: 6px; }
        
        .player-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 6px 10px; background: rgba(255,255,255,0.05); border: 1px solid #7f8c8d; border-radius: 8px; }
        .hp-container { width: 42%; background: #2c3e50; border: 2px solid #000; border-radius: 15px; overflow: hidden; position: relative; height: 18px; }
        .hp-bar { height: 100%; background: linear-gradient(90deg, #ff0000, #ff4d4d); width: 100%; transition: width 0.4s ease-out; }
        .hp-text { position: absolute; width: 100%; text-align: center; top: 0px; font-weight: bold; font-size: 11px; text-shadow: 1px 1px 2px #000; }
        .player-name { font-size: clamp(13px, 3vw, 16px); color: #D4AF37; font-weight: bold; }
        
        .energy-board { display: flex; gap: 6px; font-size: 11px; color: #f1c40f; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 5px; border: 1px solid #D4AF37; }

        /* --- 三戰區 (天、地、人) --- */
        .battlefield-container { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; justify-content: center; }
        .zone-row { display: flex; justify-content: center; gap: 8px; align-items: center; }
        .zone-label { font-size: 13px; font-weight: bold; color: #D4AF37; width: 25px; text-align: center; }
        
        .field-slot { 
            width: 24vw; max-width: 90px; height: 30vw; max-height: 120px; 
            border: 2px dashed rgba(212, 175, 55, 0.4); border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; 
            color: rgba(255,255,255,0.3); font-size: 11px; background: rgba(0,0,0,0.3);
            cursor: pointer; position: relative;
        }

        /* --- 卡牌設計 (內含圖像插畫) --- */
        .hand { display: flex; justify-content: center; gap: 1vw; padding: 4px 0; align-items: flex-end; overflow-x: auto; }
        .card { 
            width: 20vw; max-width: 88px; height: 28vw; max-height: 122px; background: #1a252f;
            border: 2px solid #8c7322; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; 
            transition: all 0.2s; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.8);
            overflow: hidden; flex-shrink: 0;
        }
        .card:active, .card:hover { transform: translateY(-8px); border-color: #f1c40f; box-shadow: 0 5px 15px rgba(212,175,55,0.6); z-index: 10; }
        
        .card-header { display: flex; justify-content: space-between; background: #2c3e50; padding: 1px 3px; font-size: 8px; border-bottom: 1px solid #8c7322; color: #D4AF37; }
        .card-img-box { width: 100%; height: 42%; background: #0d1b2a; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #8c7322; position: relative; overflow: hidden; }
        .card-img-box svg { width: 85%; height: 85%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        
        .card-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2px; background: #34495e; position: relative; }
        .card-name { font-size: clamp(10px, 2.5vw, 12px); font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }
        .card-trait { font-size: clamp(7px, 1.8vw, 9px); color: #bdc3c7; font-style: italic; }
        .card-footer { display: flex; justify-content: space-between; background: linear-gradient(180deg, #8B0000, #5c0000); color: white; font-size: clamp(10px, 2.8vw, 12px); font-weight: bold; padding: 2px 4px; border-top: 1px solid #ff4d4d; }

        .card.played { width: 22vw; max-width: 90px; height: 29vw; max-height: 124px; animation: playAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; cursor: default; }
        
        /* --- 歷史問答視窗 --- */
        #quizOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); padding: 15px; }
        .quiz-box { background: #2c3e50; border: 3px solid #D4AF37; padding: 20px; border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 0 40px rgba(212,175,55,0.5); text-align: left; }
        .quiz-box h3 { color: #e74c3c; font-size: 16px; border-bottom: 2px solid #7f8c8d; padding-bottom: 8px; margin-bottom: 12px; }
        #quizCardName { font-size: 14px; color: #f1c40f; margin-bottom: 6px; font-weight: bold; }
        #quizQuestion { font-size: clamp(14px, 3.5vw, 18px); line-height: 1.4; margin-bottom: 15px; color: #fff; }
        .quiz-options { display: grid; grid-template-columns: 1fr; gap: 8px; }
        @media (min-width: 500px) { .quiz-options { grid-template-columns: 1fr 1fr; } }
        
        .quiz-btn { background: #1a252f; border: 2px solid #7f8c8d; padding: 10px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: inherit; transition: 0.2s; text-align: left; }
        .quiz-btn:active, .quiz-btn:hover { background: #D4AF37; color: black; border-color: #D4AF37; transform: scale(1.02); }

        /* --- 動畫特效 --- */
        @keyframes playAnim { 0% { transform: scale(1.5) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-2deg); } 50% { transform: translateX(10px) rotate(2deg); } 75% { transform: translateX(-10px) rotate(-2deg); } }
        .shake-effect { animation: shake 0.4s both; border-color: #ff0000 !important; box-shadow: 0 0 25px red; }
        .correct-effect { box-shadow: 0 0 35px #2ecc71; border-color: #2ecc71 !important; }
        
        #sysMsg { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #f1c40f; padding: 10px 20px; border-radius: 30px; font-size: 15px; font-weight: bold; z-index: 1000; border: 2px solid #f1c40f; opacity: 0; pointer-events: none; width: max-content; max-width: 90vw; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="sysMsg">系統提示</div>

    <div id="lobby">
        <h1>英魂決</h1>
        <h2>中史科校本對戰系統 (即時同步與血量扣分版)</h2>
        <div class="input-group">
            <input type="text" id="roomCode" placeholder="輸入戰場密碼 (如: 888)" autocomplete="off">
            <div class="btn-container">
                <button class="btn-gold" onclick="createRoom()">創建戰局</button>
                <button class="btn-gold btn-red" onclick="joinRoom()">加入戰局</button>
            </div>
        </div>
        <p id="statusMsg" style="color: #D4AF37; margin-top: 15px; font-size: 15px;"></p>
    </div>

    <div id="gameBoard" class="hidden">
        <!-- 敵方資訊區 -->
        <div class="player-header" id="opponentArea">
            <div class="player-name">敵軍將領</div>
            <div class="hp-container">
                <div id="opponentHpBar" class="hp-bar"></div>
                <div id="opponentHpText" class="hp-text">100 / 100</div>
            </div>
            <div class="energy-board">
                <span>☯️ 華夏: <b id="oppChaos">30</b></span>
                <span>✨ 歷史: <b id="oppHongmeng">30</b></span>
            </div>
        </div>

        <!-- 三戰區 (天、地、人) -->
        <div class="battlefield-container">
            <!-- 天戰區 -->
            <div class="zone-row">
                <div class="zone-label">天</div>
                <div id="oppField_heaven" class="field-slot">敵·天</div>
                <div id="myField_heaven" class="field-slot" onclick="selectField('heaven')">我·天 (佈署)</div>
            </div>
            <!-- 地戰區 -->
            <div class="zone-row">
                <div class="zone-label">地</div>
                <div id="oppField_earth" class="field-slot">敵·地</div>
                <div id="myField_earth" class="field-slot" onclick="selectField('earth')">我·地 (佈署)</div>
            </div>
            <!-- 人戰區 -->
            <div class="zone-row">
                <div class="zone-label">人</div>
                <div id="oppField_man" class="field-slot">敵·人</div>
                <div id="myField_man" class="field-slot" onclick="selectField('man')">我·人 (佈署)</div>
            </div>
        </div>

        <!-- 我方資訊區 -->
        <div class="player-header" id="myArea" style="border-color: #D4AF37;">
            <div class="player-name">我軍將領</div>
            <div class="hp-container">
                <div id="myHpBar" class="hp-bar" style="background: linear-gradient(90deg, #2ecc71, #27ae60);"></div>
                <div id="myHpText" class="hp-text">100 / 100</div>
            </div>
            <div class="energy-board">
                <span>☯️ 華夏: <b id="myChaos">30</b></span>
                <span>✨ 歷史: <b id="myHongmeng">30</b></span>
            </div>
        </div>

        <!-- 手牌區 -->
        <div class="hand" id="myHand"></div>
    </div>

    <!-- 歷史問答視窗 -->
    <div id="quizOverlay" class="hidden">
        <div class="quiz-box" id="quizBox">
            <h3>📜 歷史考驗 (答對發動攻擊)</h3>
            <div id="quizCardName">卡牌：---</div>
            <div id="quizQuestion">題目載入中...</div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'playCard') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'attack') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'correct') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

            } else if (dynasty === '西漢' || dynasty === '東漢') {

          { "name": "張良", "dynasty": "西漢", "trait": "足智多謀", "power": 30, "hp": 150, "chaos": 0, "hongmeng": 1, "q": "有一句俗諺讚嘆張良的智慧﹕「你有XXX，我有過牆梯。」", "ans": "張良計", "options": ["張良計", "諸葛計", "曹操計", "劉邦計"] },
          { "name": "孔子", "dynasty": "春秋", "trait": "仁者無畏", "power": 40, "hp": 200, "chaos": 1, "hongmeng": 1, "q": "孔子思想的核心是什麼？", "ans": "仁", "options": ["仁", "法", "道", "術"] },
          { "name": "孟子", "dynasty": "戰國", "trait": "辯論長才", "power": 38, "hp": 190, "chaos": 0, "hongmeng": 1, "q": "《魚我所欲也》中，作者以「魚」和「熊掌」比喻「X」和「X」", "ans": "生命&道義", "options": ["生命&道義", "名與利", "功與過", "天與人"] },
          { "name": "周公旦", "dynasty": "西周", "trait": "輔佐賢君", "power": 44, "hp": 220, "chaos": 0, "hongmeng": 1, "q": "周公旦輔佐年幼的周成王，並平定了甚麼？", "ans": "三監之亂", "options": ["三監之亂", "安史之亂", "七國之亂", "黃巾之亂"] },
          { "name": "司馬遷", "dynasty": "西漢", "trait": "悲憫情懷", "power": 36, "hp": 180, "chaos": 0, "hongmeng": 1, "q": "魯迅譽《史記》為「XXXXX，XXXXX」。", "ans": "史家之絕唱，無韻之離騷", "options": ["史家之絕唱，無韻之離騷", "千古第一書", "史學之巔峰", "辭賦之始祖"] }
        ];

        function showSysMsg(msg) {
            const el = document.getElementById('sysMsg');
            el.innerText = msg; el.style.opacity = 1;
            setTimeout(() => el.style.opacity = 0, 2500);
        }

        function createRoom() {
            playSound('click');
            const code = document.getElementById('roomCode').value;
            if (!code) return showSysMsg("⚠️ 請輸入房號！");
            socket.emit('createRoom', code);
        }

        function joinRoom() {
            playSound('click');
            const code = document.getElementById('roomCode').value;
            if (!code) return showSysMsg("⚠️ 請輸入房號！");
            socket.emit('joinRoom', code);
        }

        socket.on('roomCreated', (code) => {
            myRoom = code;
            document.getElementById('statusMsg').innerText = `⛩️ 房間 [${code}] 已建立，等待對手加入戰局...`;
        });

        socket.on('errorMsg', (msg) => { showSysMsg(`❌ ${msg}`); });

        socket.on('gameStart', () => {
            playSound('correct');
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameBoard').classList.remove('hidden');
            showSysMsg("⚔️ 雙方已齊集！戰局正式開始！請選擇手牌並佈署至 天、地、人 戰區");
            updateUI();
            
            deckPool = [...fullCardDatabase].sort(() => 0.5 - Math.random());
            currentHand = deckPool.splice(0, 5);
            renderHand();
        });

        function renderHand() {
            const handDiv = document.getElementById('myHand');
            handDiv.innerHTML = '';
            currentHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <div class="card-header">
                        <span>[${card.dynasty}]</span>
                        <span>${card.hp > 0 ? 'HP ' + card.hp : '技能'}</span>
                    </div>
                    <div class="card-img-box">
                        ${getCardIllustration(card.dynasty, card.name)}
                    </div>
                    <div class="card-body">
                        <div class="card-name">${card.name}</div>
                        <div class="card-trait">「${card.trait}」</div>
                    </div>
                    <div class="card-footer">
                        <span>☯️${card.chaos} ✨${card.hongmeng}</span>
                        <span>⚔️${card.power}</span>
                    </div>
                `;
                cardEl.onclick = () => {
                    playSound('click');
                    selectedHandIndex = index;
                    showSysMsg(`👉 已選中【${card.name}】，請點擊下方任一空戰區（天/地/人）進行佈署！`);
                };
                handDiv.appendChild(cardEl);
            });
        }

        function selectField(zone) {
            if (selectedHandIndex === null) {
                return showSysMsg("⚠️ 請先在下方手牌中選擇一張卡牌！");
            }
            if (myFields[zone] !== null) {
                return showSysMsg("⚠️ 此戰區已有卡牌駐守！");
            }

            const card = currentHand[selectedHandIndex];
            myFields[zone] = card;
            playSound('playCard');

            const fieldEl = document.getElementById(`myField_${zone}`);
            fieldEl.innerHTML = `
                <div class="card played" style="width:100%; height:100%;">
                    <div class="card-header"><span>[${card.dynasty}]</span><span>⚔️${card.power}</span></div>
                    <div class="card-img-box" style="height:45%;">${getCardIllustration(card.dynasty, card.name)}</div>
                    <div class="card-body"><div class="card-name">${card.name}</div></div>
                    <div class="card-footer" style="justify-content:center;"><span>${card.trait}</span></div>
                </div>`;
            fieldEl.style.border = 'none';

            socket.emit('playCardData', { roomCode: myRoom, zone, card });
            pendingDamage = parseInt(card.power, 10);
            pendingCard = card;
            
            currentHand.splice(selectedHandIndex, 1);
            selectedHandIndex = null;
            renderHand();

            showQuiz(card);
        }

        function replenishHand() {
            if (currentHand.length < 5) {
                if (deckPool.length === 0) {
                    deckPool = [...fullCardDatabase].sort(() => 0.5 - Math.random());
                    showSysMsg("🔄 牌庫重洗，英魂再臨！");
                }
                currentHand.push(deckPool.pop());
            }
            renderHand();
        }

        socket.on('opponentPlayed', (data) => {
            playSound('playCard');
            const { zone, card } = data;
            oppFields[zone] = card;
            const field = document.getElementById(`oppField_${zone}`);
            field.innerHTML = `
                <div class="card played" style="width:100%; height:100%; border-color: #e74c3c;">
                    <div class="card-header" style="background:#8B0000;"><span>[${card.dynasty}]</span><span>⚔️${card.power}</span></div>
                    <div class="card-img-box" style="height:45%; background:#200;">${getCardIllustration(card.dynasty, card.name)}</div>
                    <div class="card-body" style="background:#5c0000;"><div class="card-name" style="color:#ffcccc;">${card.name}</div></div>
                    <div class="card-footer" style="background:#400000; justify-content:center;"><span>${card.trait}</span></div>
                </div>`;
            field.style.border = 'none';
            showSysMsg(`敵方在【${zone === 'heaven' ? '天' : zone === 'earth' ? '地' : '人'}戰區】佈署：【${card.name}】！`);
        });

        function showQuiz(card) {
            document.getElementById('quizCardName').innerText = `卡牌：【${card.name}】（特質：${card.trait}）`;
            document.getElementById('quizQuestion').innerText = card.q;
            const optionsDiv = document.getElementById('quizOptions');
            optionsDiv.innerHTML = '';
            
            const shuffledOptions = [...card.options].sort(() => 0.5 - Math.random());
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, card.ans);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('quizOverlay').classList.remove('hidden');
        }

        function checkAnswer(selected, correct) {
            const overlay = document.getElementById('quizOverlay');
            const qBox = document.getElementById('quizBox');
            
            if (selected === correct) {
                playSound('correct');
                qBox.classList.add('correct-effect');
                showSysMsg("🎯 答對了！發動卡牌戰力攻擊！");
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('correct-effect');
                    socket.emit('attackAction', { roomCode: myRoom, damage: pendingDamage, isCorrect: true });
                    replenishHand();
                }, 1000);
            } else {
                playSound('wrong');
                qBox.classList.add('shake-effect');
                showSysMsg(`❌ 答錯了！正確解答為：${correct}`);
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    qBox.classList.remove('shake-effect');
                    socket.emit('attackAction', { roomCode: myRoom, damage: 0, isCorrect: false });
                    replenishHand();
                }, 1800);
            }
        }

        function updateUI() {
            const myPct = Math.max(0, (myHp / MAX_HP) * 100);
            const oppPct = Math.max(0, (opponentHp / MAX_HP) * 100);
            
            document.getElementById('myHpBar').style.width = myPct + '%';
            document.getElementById('myHpText').innerText = `${myHp} / ${MAX_HP}`;
            document.getElementById('myChaos').innerText = myChaos;
            document.getElementById('myHongmeng').innerText = myHongmeng;
            
            document.getElementById('opponentHpBar').style.width = oppPct + '%';
            document.getElementById('opponentHpText').innerText = `${opponentHp} / ${MAX_HP}`;
            document.getElementById('oppChaos').innerText = oppChaos;
            document.getElementById('oppHongmeng').innerText = oppHongmeng;
        }

        socket.on('battleUpdate', (data) => {
            const dmg = parseInt(data.damage, 10) || 0;

            if (data.attacker === socket.id) {
                if(data.isCorrect && dmg > 0) {
                    opponentHp -= dmg;
                    if (opponentHp < 0) opponentHp = 0; 
                    
                    const oppArea = document.getElementById('opponentArea');
                    oppArea.classList.add('shake-effect');
                    setTimeout(() => oppArea.classList.remove('shake-effect'), 400);
                    playSound('attack');
                    showSysMsg(`💥 命中敵軍陣地，造成 ${dmg} 點傷害！`);
                } else {
                    showSysMsg(`🛡️ 攻擊未命中 (答錯)！`);
                }
            } else {
                if(data.isCorrect && dmg > 0){
                    myHp -= dmg;
                    if (myHp < 0) myHp = 0;

                    const myArea = document.getElementById('myArea');
                    myArea.classList.add('shake-effect');
                    setTimeout(() => myArea.classList.remove('shake-effect'), 400);
                    showSysMsg(`⚠️ 敵方答對，對您造成 ${dmg} 點傷害！`);
                    playSound('attack');
                } else {
                    showSysMsg(`🛡️ 敵方答錯了，攻擊失效！`);
                }
            }

            updateUI();
            
            setTimeout(() => {
                if (myHp <= 0) {
                    alert("敗北！歷史的巨輪將你輾過...");
                    location.reload();
                } else if (opponentHp <= 0) {
                    alert("勝利！您成功改寫了歷史！");
                    location.reload();
                }
            }, 600);
        });
    </script>
</body>
</html>
